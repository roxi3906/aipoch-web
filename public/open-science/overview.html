lank\" rel=\"noopener\"><span class=\"brand-mark\"><img src=\"/open-science/assets/e3824afb44bd1b7c.png\" alt=\"\"></span>AIPOCH</a><div class=\"nav-context\">OPEN-SCIENCE · PRODUCT & COMMUNITY · 2026.09</div></nav>\n\n<section class=\"slide slide-dark cover active\" data-page=\"01\" data-title=\"AIPOCH · Open-Science\" aria-label=\"第1页 AIPOCH Open-Science\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div>\n <img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"开放科研基础设施的建筑线稿\">\n <div class=\"brand-lead\">AIPOCH <span style=\"font:12px var(--mono);letter-spacing:.17em;color:#aaa;vertical-align:middle;margin-left:22px\">AI4SCIENCE</span></div>\n <h1 class=\"hero-title\"><span class=\"highlight-text en\">Open-Science</span></h1>\n <p class=\"cover-sub\">开源、模型自由的科研工作台</p>\n <p class=\"manifesto\">让专业科研能力触手可及，<br>让选择权回到研究者手中。</p>\n <span class=\"radar-node decor\" style=\"left:1120px;top:252px\"></span><span class=\"radar-node decor\" style=\"left:1455px;top:482px\"></span><span class=\"radar-node decor\" style=\"left:1230px;top:706px\"></span>\n <div class=\"cover-meta\">OPEN TO RESEARCH. BUILT TOGETHER.</div>\n <p class=\"cover-label\">以 Open-Science 为核心<br>共建全球科研开源社区</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">大家好，今天向大家介绍AIPOCH的科研工作台Open-Science。我们专注AI4Science，希望把专家的科研方法与AI的执行能力结合起来，帮助研究者完成具体研究，并留下可以检查和复用的结果。</p>\n<ul>\n <li>Open-Science是开源、模型自由的科研工作台。研究者可以按任务选择模型、方法和执行环境，保留自己的技术选择和科学判断。</li>\n <li>今天，我会用一项研究任务介绍工作台怎样使用，再谈专家和科研机构可以怎样参与合作。</li>\n</ul>\n<p>先从我们的出发点说起：专家积累的科研经验，怎样才能在具体任务中被用起来？</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>“模型自由”指选择模型、供应商与部署方式的自由，不代表无需模型，也不意味着第三方模型调用和算力免费。</p>\n[Sources]<br>公司与产品定义：用户提供的对外介绍。建筑素材：AIPOCH 2026 年中汇报。视觉参考：AIPOCH — Skill Infrastructure for Medical Research。\n</details>\n </aside>\n</section>\n\n<section class=\"slide\" data-page=\"02\" data-title=\"把科研经验变成可执行的科学能力\">\n <div class=\"kicker\">01 / ABOUT AIPOCH</div>\n <h2 class=\"section-title\">把科研经验，变成<span class=\"highlight-text\">可执行的科学能力</span></h2>\n <p class=\"mission-intro\">AIPOCH 是一家专注于 AI4Science 的科技公司。我们让 AI 的计算与推理能力，与人类专家长期积累的科研经验相互增强，将分散的知识、资源与工作流转化为可执行、可验证、可复用的科研能力。</p>\n <div class=\"mission-formula\">\n  <div class=\"formula-part\"><span class=\"label\">MACHINE INTELLIGENCE</span><div class=\"en-big\">AI Compute<br>& Reasoning</div><div class=\"cn\">计算 · 推理 · 执行</div></div><div class=\"formula-symbol\">×</div>\n  <div class=\"formula-part\"><span class=\"label\">HUMAN EXPERTISE</span><div class=\"en-big\">Human Research<br>Experience</div><div class=\"cn\">经验 · 方法 · 判断 · 专业边界</div></div><div class=\"formula-symbol\">→</div>\n  <div class=\"formula-part formula-result\"><span class=\"label\" style=\"color:#655b2b\">SCIENTIFIC CAPABILITY</span><div class=\"en-big\">知识可以执行，<br>经验可以复用。</div><div class=\"cn\">在真实研究中验证与改进</div></div>\n </div>\n <p class=\"summary\">让科研经验进入实际研究过程，加速科学发现。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看专家经验的价值，以及它怎样成为研究任务中可以使用的方法。</p>\n<ul>\n <li>一种方法什么时候适用、需要什么数据、结果怎样检查，往往需要专业经验判断。</li>\n <li>我们希望把这些要求整理成可执行的步骤，让AI完成工具调用和计算，研究者负责判断目标、方法和结论是否合理。</li>\n <li>专家的方法可以被重复使用，也可以结合新的任务反馈继续改进。</li>\n</ul>\n<p>要做到这一点，需要把方法接到文献、数据、工具和实际执行中。下面看这些环节有哪些衔接问题。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>用户提供的 AIPOCH 公司定义与年中汇报产品部分。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface\" data-page=\"03\" data-title=\"科研需要的不只是更强的模型\">\n <div class=\"kicker\">02 / THE RESEARCH GAP</div>\n <h2 class=\"section-title\">科研需要的，<br>不只是<span class=\"highlight-text\">更强的模型</span></h2>\n <p class=\"subtitle\">真实研究需要连接证据、方法、工具、计算环境与结果。</p>\n <div class=\"fragmented\">\n  <div class=\"fragment\"><div class=\"index\">01</div><h3>问题</h3><div class=\"en\">QUESTION</div><p class=\"gap-note\">研究目标<br>反复解释</p></div>\n  <div class=\"fragment\"><div class=\"index\">02</div><h3>证据</h3><div class=\"en\">EVIDENCE</div><p class=\"gap-note\">文献与数据<br>分散检索</p></div>\n  <div class=\"fragment\"><div class=\"index\">03</div><h3>方案</h3><div class=\"en\">METHOD</div><p class=\"gap-note\">专业方法<br>依赖经验</p></div>\n  <div class=\"fragment\"><div class=\"index\">04</div><h3>分析</h3><div class=\"en\">EXECUTION</div><p class=\"gap-note\">代码与环境<br>来回切换</p></div>\n  <div class=\"fragment\"><div class=\"index\">05</div><h3>验证</h3><div class=\"en\">VALIDATION</div><p class=\"gap-note\">过程与结果<br>难以对应</p></div>\n  <div class=\"fragment\"><div class=\"index\">06</div><h3>成果</h3><div class=\"en\">ARTIFACTS</div><p class=\"gap-note\">产物与记录<br>难以复用</p></div>\n </div>\n <p class=\"problem-foot\">当前的断点：<span style=\"color:#111\">上下文丢失、工具断裂、执行中断、来源不清</span></p>\n <p class=\"summary\">把割裂的工具连接起来，让研究可以连续进行。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看研究过程中容易断开的环节：问题、证据、方法、执行、验证和产物之间，怎样接起来。</p>\n<ul>\n <li>论文、数据、代码和图表分散在不同工具里时，研究者需要反复整理材料、补充上下文。</li>\n <li>即使得到一个答案，我们仍然要知道依据是什么、实际运行了什么，以及结果怎样产生。</li>\n <li>Open-Science把相关材料、执行过程和产物放在同一个项目中，帮助研究者接着已有工作继续。</li>\n</ul>\n<p>我们先用这段动图，看一下工作台的整体体验。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>用户确认的叙事方案；原参考稿的 Fragmented Research Workflow 结构。\n</details>\n </aside>\n</section>\n\n<section class=\"slide\" data-page=\"04\" data-title=\"从问题直接进入真实研究\">\n <div class=\"kicker\">03 / MEET OPEN-SCIENCE</div>\n <h2 class=\"section-title\">从问题，直接进入<span class=\"highlight-text\">真实研究</span></h2>\n <p class=\"subtitle\">连接 AI 模型、专业科研能力与真实研究流程。</p>\n <div class=\"content split wide-visual\">\n  <div class=\"overview-copy\"><p class=\"body-text\">Open-Science 是 AIPOCH 推出的开源、模型自由科研工作台。<br><br>自由选择工具，查看执行过程；对具备完整记录的产物版本，重新运行计算并比对结果。</p><div class=\"key-values\"><div class=\"key-value\"><b>开放</b><span>OPEN SOURCE</span></div><div class=\"key-value\"><b>自主选择</b><span>MODEL CHOICE</span></div><div class=\"key-value\"><b>过程透明</b><span>TRANSPARENT</span></div><div class=\"key-value\"><b>产物复现验证</b><span>RERUN &amp; COMPARE OUTPUTS</span></div></div></div>\n  <div><figure class=\"crop shot workbench-home full-gif\"><img alt=\"Open-Science v0.30.2 真实界面演示：首页、研究产物与版本级复现验证\" src=\"/open-science/assets/b720e64f75f220b1.gif\"></figure><div class=\"shot-caption\"><span>OPEN-SCIENCE · ARTIFACT VERIFICATION</span><span>真实界面 · 点击放大</span></div><div class=\"product-rail\"><span>项目首页</span><span>研究产物</span><span>来源记录</span><span>复现验证</span></div></div>\n </div>\n <p class=\"summary\">把研究问题、专业能力和真实执行，放进同一个工作台。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一次研究在工作台中的整体体验，后面再分别展开具体功能。</p>\n<ul>\n <li><strong>研究入口：</strong> 已有论文和数据时，可以建立项目、加入材料并说明目标，让后续分析围绕同一项研究推进。</li>\n <li><strong>真实执行：</strong> 需要计算、查询或生成文件时，Agent可以调用工具，产出可以打开查看的图表、报告或其他文件。</li>\n <li><strong>结果检查：</strong> 想了解结果怎样产生时，可以查看来源；对捕获条件完整的产物版本，还可以重跑并比对输出。</li>\n</ul>\n<p>这个工作台也面向不同背景的参与者。下面看大家可以在这里扮演什么角色。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>右侧动图由 2026-09-17 在本地 Open-Science v0.30.2 截取的真实完整窗口组成，依次展示首页、产物、生成代码与复现验证。artifact-verification-demo-r.csv 使用明确标注的人工示例数据 S1=10、S2=20、S3=30，只演示确定性计算与文件比对，不代表科研结论或客户案例。该版本使用已有 R 环境生成；实际隔离复现后显示 Result reproduced，选定输出与原产物一致。截图切换不是连续录屏。</p>\n<p>产物验证仅针对被捕获的特定版本，不承诺完整会话回放或科学结论正确。记录缺失的历史产物可能不可验证。</p>\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.30.2\" target=\"_blank\" rel=\"noopener\">Open-Science v0.30.2：版本级复现验证与支持边界</a>；2026-09-17 本地真实界面及人工 CSV 示例的 Notebook、产物版本与 Reproducibility 测试。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"面向全球科研的公共空间\">\n <div class=\"kicker\">04 / THE GLOBAL SCIENTIFIC COMMONS</div>\n <h2 class=\"section-title\">一个工作台，<br>也是一块<span class=\"highlight-text\">全球科研公共空间</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">以 Open-Science 为共同基础设施，<br>让不同领域的参与者在同一空间协作。</p><div class=\"commons-share\"><h3>社区共享的，不只是代码。</h3><p>代码 · 方法 · 能力包<br>工作流 · 验证记录 · 研究经验</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">4K+</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub 关注度 · 资料快照 2026.09</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Open-Science 共享科研空间共建示意\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"圆形共享科研工作台中的四组参与者：左前方研究者分析数据，后方两人讨论方法，前方开发者编排工作流，右侧科研机构的三人实验组操作显微镜、移液器和样本。\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"选择四类共建角色，查看协作方式\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"研究者共建路径\">研究者</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"领域专家共建路径\">领域专家</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"开发者共建路径\">开发者</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"科研机构共建路径\">科研机构</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">点击角色，高亮对应小组，查看共建方式。</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">共建链路</span><span>使用能力</span><span class=\"cycle-arrow\">↔</span><span>交流问题</span><span class=\"cycle-arrow\">↔</span><span>检查方法</span><span class=\"cycle-arrow\">↔</span><span>贡献经验</span><span class=\"cycle-arrow\">↔</span><span>共同改进</span></p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看Open-Science面向谁，以及为什么需要不同专业背景的人共同参与。</p>\n<ul>\n <li>研究者带来真实问题，专家贡献方法，开发者接入工具，科研机构参与验证与合作。</li>\n <li>可以共享的内容包括方法、代码、能力包和验证经验，让其他研究不必每次从头整理。</li>\n <li>是否贡献和公开，由参与者决定；使用产品不要求公开私人数据和成果。</li>\n</ul>\n<p>下面以“已有论文和数据，希望复现一个关键结果”为例，看一项研究怎样推进。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>共建链路：使用能力 ↔ 交流问题 ↔ 检查方法 ↔ 贡献经验 ↔ 共同改进。点击四类角色可查看各自的共建方式。概念插画不代表实际办公空间、合作伙伴或在线协作界面。4K+ Stars 为 2026-09 资料快照，展示项目关注度，不是用户数、贡献者数或全球排名。</p>\n[Sources]<br>四类共建角色及说明、社区共享对象与共建链路：用户明确提供。插画：AIPOCH 共享科研工作台概念图。关注度：Open-Science GitHub 仓库 2026-09 资料快照。<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub 仓库</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"六大功能，贯穿一次研究旅程\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">一个研究问题，走向<span class=\"highlight-text\">可检查的结果</span></h2>\n <p class=\"subtitle\">以论文结果复现为例，六大功能系统接续同一项研究。</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">示例任务</span><p>我有论文和数据，想复现其中的关键结果。</p><span class=\"journey-hint\">点击步骤，跟随研究过程 →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"六大功能系统与研究者使用旅程\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"第1步 建立研究项目\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">建立研究项目</span><span class=\"journey-capability\">研究项目与持续上下文</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"第2步 加载专业能力\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">加载专业能力</span><span class=\"journey-capability\">Specialist 与 Skill 生态</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"第3步 选择模型与环境\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">选择模型与环境</span><span class=\"journey-capability\">Model · Agent<br>Slurm / SSH · Runtime</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"第4步 确认计划并执行\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">确认计划并执行</span><span class=\"journey-capability\">科研执行与任务编排</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"第5步 查看研究产物并按需标注\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">查看研究产物</span><span class=\"journey-capability\">Artifact · 可选修改</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"第6步 产物复现验证：按需验证已捕获的产物版本\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">产物复现验证</span><span class=\"journey-capability\">版本级重跑与比对</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">先明确：这次要复现什么？</h3><p class=\"journey-detail-copy\">创建项目，写清复现目标；加入论文与数据，让后续讨论都接着已有材料继续。</p><p class=\"journey-result\"><span>本步得到</span>包含目标和材料的研究项目</p><button class=\"journey-next\" data-journey-to=\"1\">下一步：加载专业能力 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/d13cf784f5a9e6bd.png\" alt=\"Open-Science 创建项目界面：填写研究项目名称\" style=\"width:275.6435643564356%;left:-87.92079207920793%;top:-168.1592039800995%;height:auto\"></figure></div><figcaption>创建项目 · 确定目标与上下文 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">让专业能力进入这次研究。</h3><p class=\"journey-detail-copy\">选择适合任务的 Specialist，查找并加载 Skill，按需接入工具和数据。</p><p class=\"journey-result\"><span>本步得到</span>为当前任务加载的专业能力</p><button class=\"journey-next\" data-journey-to=\"2\">下一步：选择模型与环境 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/860ec00c1fb345e1.png\" alt=\"Open-Science Skills 界面：搜索、添加与启用科研能力\" style=\"width:222.63681592039802%;left:-74.50248756218906%;top:-99.22879177377892%;height:auto\"></figure></div><figcaption>Skills · 查找并自主加载 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">决定用什么工具，在哪里运行。</h3><p class=\"journey-detail-copy\">选择模型与 Agent，配置 Python / R 环境；需要时连接 SSH 主机或 Slurm 计算集群。</p><p class=\"journey-result\"><span>本步得到</span>本次研究的模型与运行环境</p><button class=\"journey-next\" data-journey-to=\"3\">下一步：确认计划并执行 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/1c9871b2f41e1095.png\" alt=\"Open-Science 模型设置：选择模型服务商与接入方式\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div><figcaption>Model · 自主选择研究使用的模型 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">看过计划，再开始执行。</h3><p class=\"journey-detail-copy\">审阅计划与权限后，Agent 与 Sub-agents 分工执行，调用工具和代码；可查看进度、补充指导。</p><p class=\"journey-result\"><span>本步得到</span>运行记录、代码和中间结果</p><button class=\"journey-next\" data-journey-to=\"4\">下一步：查看研究产物 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science 研究计划确认界面：对话澄清、分阶段任务与 Approve 操作\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>研究计划 · 审阅步骤后确认执行 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">查看结果；需要时，再标注修改。</h3><p class=\"journey-detail-copy\">图表、文本或 Notebook 可直接查看和交付；如需调整，可选中内容或标记图片位置，把修改要求交给 Agent。</p><p class=\"journey-result\"><span>本步得到</span>版本化产物与可选的定点修改入口</p><button class=\"journey-next\" data-journey-to=\"5\">下一步：产物复现验证 →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0416666667\"><figure class=\"crop shot\" data-crop=\"artifactAnnotation|1120,590,980,480\" style=\"aspect-ratio:980/480\"><img src=\"/open-science/assets/80d177354028b914.jpg\" alt=\"Open-Science 产物预览：在需要修改时标记图片位置并添加给 Agent 的上下文\" style=\"width:218.6734693877551%;left:-114.28571428571428%;top:-122.91666666666667%;height:auto\"></figure></div><figcaption>产物预览 · 需要时标注并交给 Agent 修改 · 点击放大</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">检查产物能否复现</h3><p class=\"journey-detail-copy\">可针对已捕获的产物版本运行复现验证，在隔离工作区重跑计算、比对输出。记录不完整时，验证可能不可用。</p><p class=\"journey-result\"><span>可获得</span>复现比对结果与差异记录</p><button class=\"journey-next\" data-journey-to=\"3\">↶ 需要时，回到第 4 步调整计划</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.783687943262411\"><figure class=\"crop shot\" data-crop=\"artifactVerification|1275,228,785,282\" style=\"aspect-ratio:785/282\"><img src=\"/open-science/assets/5502c775b50c690b.png\" alt=\"Open-Science 已捕获产物版本的真实复现验证结果：人工 CSV 示例显示 Result reproduced，选定输出与原产物一致\" style=\"width:264.3312101910828%;left:-162.4203821656051%;top:-80.85106382978722%;height:auto\"></figure></div><figcaption>Reproducibility · 人工示例验证通过 · 点击查看完整截图</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">项目上下文、文件与来源记录贯穿全程；发现差异，可以回到前面的步骤继续研究。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一项研究的完整路径。这是一张总览地图，后面几页分别介绍支撑它的能力。</p>\n<ul>\n <li><strong>建立研究项目：</strong> 先明确想复现哪个结果，加入论文和数据，让目标与材料有统一位置。</li>\n <li><strong>加载专业能力：</strong> 任务需要特定方法时，选择合适的Skill或Specialist，让分析有明确的专业要求。</li>\n <li><strong>选择模型与环境：</strong> 根据任务需要选择模型、Agent和运行环境，需要远程计算时再连接服务器或集群。</li>\n <li><strong>确认计划并执行：</strong> 复杂任务可以先确认思路，再调用工具运行；分工和额外审查按需启用。</li>\n <li><strong>查看研究产物：</strong> 检查图表、报告或Notebook，符合要求就可以直接使用；需要调整时才修改。</li>\n <li><strong>产物复现验证：</strong> 希望检查计算输出能否重现时，可以对捕获条件完整的产物版本重跑并比对。</li>\n</ul>\n<p>这些能力可以按任务需要使用，不是每项研究都必须完成所有操作。先看研究跨越多次会话时，之前的工作怎样保留。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>示例任务为讲解用情境，不是客户引言或效果承诺。截图来自不同演示，不声称是一次连续研究。第 6 步截图为 2026-09-17 本地 Open-Science v0.30.2 的实际测试：人工 CSV 示例 S1=10、S2=20、S3=30 在已有 R 环境生成，隔离复现后显示 Result reproduced，选定输出与原产物一致；这只证明该版本的计算产物可复现。页面聚焦结果卡片，点击后查看未裁切的完整窗口。</p>\n<p>本页复现验证说明对应 v0.30.2，部分旅程截图沿用 v0.26.0（2026-09-07）资料快照。Desktop、Web、Mobile、CLI / Headless 的具体支持范围依端与环境而异。MedFlow 的专业工作流模块仍按后续页面的产品状态说明。</p>\n[Sources]<br>Open-Science v0.26.0 产品界面与发布资料；<a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">Annotation：将选中的产物上下文交给 Agent</a>；<a href=\"https://github.com/aipoch/open-science/releases/tag/v0.30.2\" target=\"_blank\" rel=\"noopener\">v0.30.2：产物版本复现验证与支持边界</a>；2026-09-17 本地人工 CSV 的实际复现测试。<br>用户提供的 Project、Skills、Model、Session Plan、Artifacts 与 Annotation 产品截图。\n</details>\n </aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"研究不会在一次对话结束\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">研究不会在<span class=\"highlight-text\">一次对话结束</span></h2>\n <p class=\"subtitle\">以项目组织研究，让上下文、材料与历史决策持续积累。</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"研究项目持续性功能\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>项目与会话持续保存</b><small>同一项目内积累讨论、文件与成果。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>项目上下文</b><small>让每个会话继承共同目标与研究约束。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-memory\"><span class=\"num\">03</span><span><b>长期研究记忆</b><small>保存稳定偏好与研究背景；时间敏感事实仍需核验。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">04</span><span><b>研究分支</b><small>从当前工作创建新会话，探索另一条路径。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">05</span><span><b>全局搜索与会话引用</b><small>首页 Search / ⌘K / Ctrl+K；用 # 引用已有会话。</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">06</span><span><b>Side chat：多标签页并行</b><small>多个独立标签页可与主会话同时运行。</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.7777777777777777\"><figure class=\"crop\" data-crop=\"workspaceProject|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/b222df7f22573047.jpg\" alt=\"Open-Science 项目全景：同一项目内保存多个研究会话、文件与成果\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project workspace · 多次研究持续积累</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:.7689822294022617\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceContext|0,0,476,619\" style=\"aspect-ratio:476/619\"><img src=\"/open-science/assets/bd4267932c391f0f.jpg\" alt=\"Open-Science Project Settings：为项目填写 Agent Context\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project Agent Context · 共同目标与约束进入每个会话</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-memory\" style=\"--workspace-shot-ratio:1.3982808022922637\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"memory|0,0,976,698\" style=\"aspect-ratio:976/698\"><img src=\"/open-science/assets/4f45037e594fef5f.png\" alt=\"Open-Science Memory 设置：管理长期研究偏好与稳定背景信息\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Research Profile · 把稳定偏好带入后续研究</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.8333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceBranch|600,800,1100,600\" style=\"aspect-ratio:1100/600\"><img src=\"/open-science/assets/4bb8c2a8d10c2112.jpg\" alt=\"Open-Science 从研究结果创建新会话分支的操作入口\" style=\"width:181.72727272727275%;left:-54.54545454545454%;top:-133.33333333333331%;height:auto\"></figure><figcaption>Branch in new session · 从已有工作继续探索</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.743276283618582\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"globalSearch|380,125,1426,818\" style=\"aspect-ratio:1426/818\"><img src=\"/open-science/assets/8ae9d8a04ae2ff3b.png\" alt=\"Open-Science 全局搜索面板：消息、会话、项目、上传文件、生成文件与文献库\" style=\"width:153.36605890603084%;left:-26.64796633941094%;top:-15.28117359413203%;height:auto\"></figure><figcaption>Global Search · ⌘K / Ctrl+K · 点击查看完整界面</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.2857142857142858\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceSidechat|620,685,900,700\" style=\"aspect-ratio:900/700\"><img src=\"/open-science/assets/34b8bac0510d9049.png\" alt=\"Open-Science Side chat 侧边对话入口，旧版界面截图\" style=\"width:191.66666666666669%;left:-68.88888888888889%;top:-97.85714285714285%;height:auto\"></figure><figcaption>Side chat · 侧边对话入口（旧版界面）</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">每次研究都接着已有工作继续，不必反复解释同一段背景。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一项研究怎样持续推进，重点是保留上下文，以及管理不同的研究思路。</p>\n<ul>\n <li><strong>项目与会话：</strong> 一项研究需要多次分析时，可以在同一项目中保留材料和会话，方便接着已有工作继续。</li>\n <li><strong>项目上下文：</strong> 多个会话需要遵循相同目标和约束时，可以设置共同背景，减少反复说明。</li>\n <li><strong>长期记忆：</strong> 研究背景和偏好长期稳定时，可以保存为记忆，供后续任务按需参考。</li>\n <li><strong>分支对话：</strong> 想从同一处尝试另一种方法时，可以另开研究路径，同时保留原来的过程和成果，方便比较。</li>\n <li><strong>侧边对话：</strong> 主线推进时想追问局部问题，可以打开独立侧聊；多个标签页可并行讨论，不必打断主会话。</li>\n <li><strong>全局搜索：</strong> 找不到过去的讨论或文件时，可以从统一入口检索，减少在项目和会话之间翻找。</li>\n <li><strong>会话引用：</strong> 新任务需要参考已有讨论时，可以引用对应会话，不必手动复制整段记录。</li>\n</ul>\n<p>研究思路能够接续以后，我们再看论文里的证据怎样进入分析。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>全局搜索：2026.09.17 本地 Open-Science v0.30.2 真实界面截图及 Search 快捷键提示。<br>Side chat 多个独立标签页与主会话同时运行：AIPOCH 本次确认的产品能力。<br>其余界面沿用 AIPOCH 提供的 Open-Science v0.26.0 产品演示截图。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface literature\" data-page=\"08\" data-title=\"从文献发现，到可提问、可追溯的证据\">\n <div class=\"kicker\">07 / LITERATURE REFERENCE LIBRARY</div>\n <h2 class=\"section-title\">从文献发现，到<span class=\"highlight-text\">可提问、可追溯的证据</span></h2>\n <p class=\"subtitle\">批量导入 PDF，提取图表结构并导出表格，让 Agent 结合原文与提取图表回答问题。</p>\n <div class=\"content literature-interactive gallery\" data-gallery=\"literature\">\n  <div class=\"literature-tabs\" role=\"tablist\" aria-label=\"文献资料库功能\">\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"literature-library\"><span class=\"literature-num\">01</span><span><b>批量导入与管理</b><small>多篇 PDF 一次导入，跨项目检索</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-reference\"><span class=\"literature-num\">02</span><span><b>文献记录</b><small>元数据、附件与项目关联</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-fulltext\"><span class=\"literature-num\">03</span><span><b>高亮原文提问</b><small>选中具体句子，结合文献上下文提问</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-figures\"><span class=\"literature-num\">04</span><span><b>图表提取与导出</b><small>提取结构、导出表格，供 Agent 读取</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-citation\"><span class=\"literature-num\">05</span><span><b>引用</b><small>复制与格式导出</small></span></button>\n  </div>\n  <div class=\"literature-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"literature-library\"><figure class=\"crop\" data-crop=\"literatureLibrary|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/cdc78c7a9691f76c.png\" alt=\"Open-Science 文献资料库：跨项目检索、筛选、评分与去重\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>LIBRARY · 参考文献统一检索、筛选、评分与去重</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-reference\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureReference|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/e98f87a6d3b03588.png\" alt=\"Open-Science 文献记录：DOI、作者、标签、附件与项目关联\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>RECORD · DOI、作者、标签、附件与项目关系</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-fulltext\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFullText|300,0,2260,1271\" style=\"aspect-ratio:2260/1271\"><img src=\"/open-science/assets/99c9442a1357e738.jpg\" alt=\"Open-Science：在 PDF 中高亮具体句子，并在同一研究会话中向 Agent 提问\" style=\"width:113.27433628318585%;left:-13.274336283185843%;top:0%;height:auto\"></figure><figcaption>READ &amp; ASK · 高亮具体句子，在文献上下文中向 Agent 提问</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-figures\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFigures|160,134,1868,838\" style=\"aspect-ratio:1868/838\"><img src=\"/open-science/assets/8dc14eb748c6f2e8.png\" alt=\"Open-Science 文献 Figures and tables：图表结构提取及 Read with agent 入口\" style=\"width:117.07708779443256%;left:-8.565310492505352%;top:-15.990453460620524%;height:auto\"></figure><figcaption>FIGURES &amp; TABLES · 图表提取、表格导出与 Agent 读取</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-citation\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureCitation|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/6e81dbe2ab53bdd6.png\" alt=\"Open-Science 文献引用：APA 等格式与 BibTeX、RIS 导出\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>CITATIONS · 常用格式复制，BibTeX / RIS 导出</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">原文与提取图表共同进入研究，Agent 的回答仍可回到文献中核查。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看外部文献怎样成为研究中可以提问、使用和核查的证据。</p>\n<ul>\n <li><strong>批量导入与管理：</strong> 已有多篇PDF时，可以一次导入并统一检索、筛选和检查重复记录，方便整理资料。</li>\n <li><strong>文献记录与项目关联：</strong> 同一论文用于不同研究时，可以保留元数据、附件和项目关系，方便查找出处与使用背景。</li>\n <li><strong>高亮原文提问：</strong> 对某一句结论或方法有疑问时，可以选中原文提问，让问题明确指向具体内容。</li>\n <li><strong>图表提取：</strong> 想分析论文图表时，可以提取相关内容，减少人工整理；提取结果仍需对照原文检查。</li>\n <li><strong>表格导出：</strong> 需要进一步分析论文表格时，可以导出提取后的表格，便于交给后续分析工具使用。</li>\n <li><strong>Agent读取提取图表：</strong> 需要解释图表或结合正文讨论时，可以让Agent使用提取内容，帮助理解证据，而不只依赖正文描述。</li>\n <li><strong>引用复制与导出：</strong> 写报告或论文时，可以复制引用、导出参考文献格式，减少手动整理出处。</li>\n</ul>\n<p>证据准备好后，接下来选择用什么技术，以及在哪里运行分析。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>提取结果与 Agent 的回答仍需对照原文核查，不保证每张图表都能完整、准确提取。当前提取入口提示暂不支持扫描件与旋转页面。全文可用性取决于来源、许可与网络环境。</p>\n[Sources]<br>Open-Science v0.30.2 本地 Figures and tables 产品界面，2026.09.17；演示文献：Breaking the scaling relationship via thermally stable Pt/Cu single atom alloys for catalytic dehydrogenation（Nature Communications，2018）。<br>AIPOCH 产品能力说明，2026.09.17：批量 PDF 导入、图表结构提取、表格导出及 Agent 读取提取后的图表。<br>文献库、记录与引用界面沿用 Open-Science v0.26.0 截图（2026-09-07），原文提问截图由 AIPOCH 于 2026-09-08 提供。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"09\" data-title=\"把技术选择权留给研究者\">\n <div class=\"kicker\">08 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">模型、Agent、算力和环境，<span class=\"highlight-text\">由你决定</span></h2>\n <p class=\"subtitle\">围绕研究任务选择工具，不必围绕某个工具改变研究方式。</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Agent 自由</h3><p>4 种执行框架：Claude Agent、OpenCode、Codex 与 CodeBuddy。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>模型自由</h3><p>多家模型服务商、兼容网关与订阅登录，支持任务内切换。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>算力自由</h3><p>本地运行，或连接 SSH 与 Slurm 计算集群。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>环境自由</h3><p>Python / R / REPL，持久 Kernel、环境修复与网络保护。</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>数据自由</h3><p>项目材料、24 个科研 Connector、200+ 工具与自定义 MCP。</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"技术选择截图\"><button role=\"tab\" aria-selected=\"true\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackAgent|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/0e88d4e9cdaa2c78.png\" alt=\"Open-Science v0.30.2 Agent 设置：Claude Agent、OpenCode、Codex 与 CodeBuddy 四种框架\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackModel|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/c76062e747bd867c.png\" alt=\"Open-Science v0.30.2 模型设置：订阅登录与多家 API 服务商的选择入口\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackCompute|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/74f4c2e211ba13fc.png\" alt=\"Open-Science v0.30.2 Compute：远程 SSH 主机的 Slurm HPC 配置表单\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackRuntime|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/7c59bc409d7a5391.png\" alt=\"Open-Science v0.30.2 Runtimes：应用管理与自选的 Python、R 环境及包管理入口\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackConnectors|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/bba1f6978cd1fdae.png\" alt=\"Open-Science v0.30.2 Connectors：24 个已安装科研连接器、筛选与批量管理入口\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n </div><div class=\"shot-caption\"><span>CHOOSE YOUR STACK</span><span>点击标签切换真实截图</span></div><p class=\"small-note\">选择第三方模型、远程服务或数据连接器时，数据传输与费用取决于所选服务及配置。</p></div></div>\n <p class=\"summary\">技术组合可以更换，研究目标与选择权始终属于研究者。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看研究的技术配置：用什么模型和执行框架，在哪里运行，以及连接哪些数据。</p>\n<ul>\n <li><strong>Agent选择：</strong> 团队已有熟悉的执行框架时，可以选择支持的Agent，便于沿用适合任务的工具执行方式。</li>\n <li><strong>模型选择：</strong> 对能力、成本或账号有不同要求时，可以选择支持的模型服务，不必绑定单一模型。</li>\n <li><strong>算力配置：</strong> 任务需要已有服务器或集群时，可以按需连接SSH和Slurm，利用现有计算资源。</li>\n <li><strong>运行环境：</strong> 分析依赖Python、R或特定软件包时，可以配置相应Runtime，并管理持续运行的代码环境。</li>\n <li><strong>数据与工具连接：</strong> 需要科研数据库或外部工具时，可以配置Connector或MCP，把相关资源接入任务。</li>\n</ul>\n<p>这些选择解决的是技术配置。下一页看专业方法：分析应该遵循哪些步骤和要求？</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>使用云端模型、远程端点或第三方连接器时，相关请求可能发送给所选服务。本地优先不等于任何配置下数据都不会离开设备，费用及数据政策取决于所选服务。</p>\n[Sources]<br>本地 Open-Science v0.30.2 Model、Agent、Runtimes、Compute 与 Connectors 设置界面，2026.09.17。<br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#model-providers\" target=\"_blank\" rel=\"noopener\">官方 README：模型接入方式、四种 Agent 与 24 个内置 Connector（查阅于 2026.09.17）</a><br><a href=\"https://github.com/aipoch/open-science/blob/f0c0e08125c2c2acc091e5c7ae10e3e8c88a5341/src/main/connectors/registry.ts\" target=\"_blank\" rel=\"noopener\">官方连接器工具注册表与引入的描述文件：200+ 工具的代码依据</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"10\" data-title=\"全球科研能力，按需加载\">\n <div class=\"kicker\">09 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">全球科研能力，<span class=\"highlight-text\">按需加载</span></h2>\n <p class=\"subtitle\">多学科 Specialist 组织专业能力，开放 Skills 将方法转化为可执行行动。</p>\n <div class=\"content\"><div class=\"gallery marketplace-gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Skills 与 Specialists 市场功能\"><button role=\"tab\" aria-selected=\"true\" data-select=\"discover\">发现</button><button role=\"tab\" aria-selected=\"false\" data-select=\"install\">安装</button><button role=\"tab\" aria-selected=\"false\" data-select=\"batch\">批量安装</button><button role=\"tab\" aria-selected=\"false\" data-select=\"updates\">更新</button><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"false\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"discover\" role=\"tabpanel\" style=\"--market-shot-ratio:2.85714\"><figure class=\"crop\" data-crop=\"marketplaceDiscover|216,90,1400,490\" style=\"aspect-ratio:1400/490\"><img src=\"/open-science/assets/5af5576dbc1d742f.jpg\" alt=\"Open-Science v0.30.2 Skills Marketplace：搜索、分类、安装状态筛选与单个安装入口\" style=\"width:118.57142857142857%;left:-15.428571428571427%;top:-18.367346938775512%;height:auto\"></figure><p class=\"marketplace-caption\">搜索与分类筛选，找到适合任务的 Skill · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"install\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceInstall|506,96,840,390\" style=\"aspect-ratio:840/390\"><img src=\"/open-science/assets/493df4ad7b92989f.jpg\" alt=\"Open-Science v0.30.2 Skill 详情：作者、版本、许可证、来源与安装入口\" style=\"width:197.61904761904762%;left:-60.238095238095234%;top:-24.615384615384617%;height:auto\"></figure><p class=\"marketplace-caption\">查看版本与来源，再按需安装 · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"batch\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceBatch|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/1de5699314b5f499.jpg\" alt=\"Open-Science v0.30.2 批量管理：选中两个未安装 Skill，展示统一安装入口，未执行安装\" style=\"width:118.57142857142857%;left:-15.428571428571427%;top:-13.846153846153847%;height:auto\"></figure><p class=\"marketplace-caption\">多选 Skill，统一确认安装 · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"updates\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceUpdates|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/06cbb5acf977cd78.jpg\" alt=\"Open-Science v0.30.2 Updates 更新列表：当前账户待更新数量为零\" style=\"width:118.57142857142857%;left:-15.428571428571427%;top:-13.846153846153847%;height:auto\"></figure><p class=\"marketplace-caption\">检查待更新版本，确认后更新；当前无待更新 · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\" style=\"--market-shot-ratio:1.90698\"><figure class=\"crop specialist-shot\" data-crop=\"marketplaceSpecialists|506,98,820,430\" style=\"aspect-ratio:820/430\"><img src=\"/open-science/assets/2fc5dd06dadd3d08.jpg\" alt=\"Open-Science v0.30.2 Specialist Marketplace：多学科专家包、版本、发布者与已安装状态（完整原图）\" style=\"width:202.4390243902439%;left:-61.70731707317073%;top:-22.790697674418606%;height:auto\"></figure><p class=\"marketplace-caption\">按专业任务浏览与安装 Specialist · 点击放大</p></div>\n <div class=\"gallery-panel\" data-panel=\"skills\" role=\"tabpanel\" style=\"--market-shot-ratio:1.71429\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/a5240cb3645ee9d5.png\" alt=\"Open-Science Skills：浏览、启用、上传、从 GitHub 导入或创建科研 Skill\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-26.785714285714285%;height:auto\"></figure><p class=\"marketplace-caption\">按需加载、创建或导入自己的 Skill · 点击放大</p></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>覆盖 8+ 学科方向：</b>生命科学、医学、化学、物理、天文、环境科学、工程与数据科学。</span></p><p><span>02</span><span class=\"skill-copy\"><b>自由加载、创建与分享：</b>自然语言创建、上传或从 GitHub 导入；向 Marketplace 贡献的能力经审核后发布。</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN SKILL MARKETPLACE · USE & CONTRIBUTE</span></div><p class=\"resource-snapshot\">GitHub Stars 快照 · 2026.09.17</p>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">45.3K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · 多学科科研与分析</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">176.8K ★ ↗</span></div><p class=\"source-desc\">Anthropic 官方 Agent Skills · 文档、设计与开发工作流</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">3.1K ★ ↗</span></div><p class=\"source-desc\">Science Skills · 基因组学、结构生物学与检索</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-logo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills 项目标识\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">42.8K ★ ↗</span></div><p class=\"source-desc\">科研检索、写作、绘图、审稿与研究记录</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA 官方标识\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">461 ★ ↗</span></div><p class=\"source-desc\">生命科学 Agent Toolkit · 蛋白、分子与基因组</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>YOUR SKILL → MARKETPLACE</b><p>经审核后发布，让全球研究者加载、验证、复用与共同改进。</p></div></div>\n </div>\n </div>\n <p class=\"summary\">按需发现、安装与更新科研能力，也可将自己的方法贡献给社区。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看怎样把专业方法带进研究。上一页选技术，这一页选任务需要的专业能力。</p>\n<ul>\n <li><strong>Skill：</strong> 需要使用一项具体方法时，可以加载封装好的步骤和要求，方便重复使用，减少遗漏。</li>\n <li><strong>Specialist：</strong> 任务需要某类专业角色组织方法和工具时，可以选择相应Specialist，让任务遵循该角色的专业要求。</li>\n <li><strong>Marketplace发现：</strong> 不知道有哪些能力可用时，可以搜索和查看详情，判断是否适合当前任务。</li>\n <li><strong>安装与按需加载：</strong> 找到合适能力后，可以安装并在任务中选择使用，不必把全部能力都启用。</li>\n <li><strong>批量安装：</strong> 需要准备一组相关能力时，可以批量选择安装，减少逐项操作。</li>\n <li><strong>能力更新：</strong> 已安装能力有新版本时，可以检查变化再更新，便于维护已有配置。</li>\n <li><strong>Skill创建与导入：</strong> 专家已有成熟方法时，可以整理或导入为Skill，把一次性的经验变成可复用的能力。</li>\n</ul>\n<p>材料、技术和方法准备好以后，我们看任务运行时怎样组织和跟进执行。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>本地 Open-Science v0.30.2 白色 Skills Marketplace、Skill 详情、Batch manage、Updates 与 Specialist Marketplace 界面，2026.09.17；原 Skills 截图由 AIPOCH 提供。<br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#core-capabilities\" target=\"_blank\" rel=\"noopener\">官方 README：能力安装、更新、创建、导入与审核发布（2026.09.17）</a><br><a href=\"https://github.com/aipoch/openscience-skill-marketplace\" target=\"_blank\" rel=\"noopener\">Skills Marketplace</a><br><a href=\"https://github.com/aipoch/openscience-specialist-marketplace\" target=\"_blank\" rel=\"noopener\">Specialist Marketplace</a><br>Stars 来源：GitHub API /repos/{owner}/{repo} 的 stargazers_count 字段，以下各项目 2026.09.17 快照。<br><a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense Scientific Agent Skills</a><br><a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a><br><a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a><br><a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a><br><a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a>\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"11\" data-title=\"从科研能力，到真实研究执行\">\n <div class=\"kicker\">10 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">从科研能力，<span class=\"highlight-text\">到真实研究执行</span></h2>\n <p class=\"subtitle\">按任务需要开启 Delegation，按需启用 Reviewer。长任务可在后台执行，完成后结果自动回传。</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"真实研究执行的四个能力演示\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>定义任务，按需规划</b><small>需要 Plan 时，研究者确认</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>按需委派，并行分工</b><small>按任务需要开启 Delegation</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>工具执行与后台任务</b><small>长任务完成后，结果自动回传</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>按需启用 Reviewer</b><small>检查当前轮次的记录与证据</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK &amp; PLANNING</strong><span>需要规划时，研究者检查并确认 Plan</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"journeyPlan|850,0,878,650\" style=\"aspect-ratio:878/650\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science Session Plan 示例：需要规划时，研究者可查看并确认目标、步骤与交付物\" style=\"width:196.8109339407745%;left:-96.81093394077449%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SESSION PLAN EXAMPLE</span><span>目标 · 步骤 · 边界 · 交付物</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / OPTIONAL DELEGATION</strong><span>按任务需要开启 Session 级 Delegation</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"subagents|75,250,900,340\" style=\"aspect-ratio:900/340\"><img src=\"/open-science/assets/6dac6a590e97efcb.png\" alt=\"Open-Science Delegation 示例：启用分工后，主 Agent 委派给 5 个 Sub-agents 并显示完成状态\" style=\"width:115.44444444444444%;left:-8.333333333333332%;top:-73.52941176470588%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>DELEGATION EXAMPLE: 5 SUB-AGENTS</span><span>任务名称 · 专业角色 · 执行状态</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / TOOLS &amp; BACKGROUND EXECUTION</strong><span>Notebook、REPL 与 Shell 支持后台长任务</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"live|520,720,1100,520\" style=\"aspect-ratio:1100/520\"><img src=\"/open-science/assets/b1110a6a25a8964a.png\" alt=\"Open-Science 工具执行示例：Notebook、工具调用与运行状态\" style=\"width:232.72727272727272%;left:-47.27272727272727%;top:-138.46153846153845%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SKILL · CONNECTOR · PYTHON / R · REMOTE COMPUTE</span><span>后台任务完成后，结果自动回传</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / OPTIONAL REVIEWER</strong><span>按需启用检查，专业判断由研究者负责</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"reviewer|1460,0,1100,720\" style=\"aspect-ratio:1100/720\"><img src=\"/open-science/assets/2ebc9a694ad40a1a.png\" alt=\"Open-Science Reviewer 检查示例：按需检查当前轮次的回复、执行记录与相关文件证据\" style=\"width:232.72727272727272%;left:-132.72727272727275%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>RESPONSES · EXECUTION LOGS · FILE EVIDENCE</span><span>检查范围以当前轮次可用记录为限</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">研究者控制方向，Agent 调用真实工具执行。任务分工与 Reviewer 检查均按需启用。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看任务执行中的工作：怎样确认思路、按需分工、跟进进度，以及增加检查。</p>\n<ul>\n <li><strong>Plan first：</strong> 任务复杂、希望先确认分析思路时，可以先看计划再执行，减少方向不合适时的返工。</li>\n <li><strong>Delegation：</strong> 工作能拆成相对独立的任务时，可以按需交给Sub-agents处理，由主Agent汇总各部分结果。</li>\n <li><strong>真实工具执行：</strong> 需要计算、查询或生成文件时，Agent可以调用实际工具，把分析要求落实为运行过程和产物。</li>\n <li><strong>后台长任务：</strong> 计算耗时较长时，可以让支持的任务在后台运行，完成后返回结果，不必一直守着进度。</li>\n <li><strong>Reviewer：</strong> 希望额外检查方法、依据或结论表达时，可以按需启用，帮助发现需要进一步核查的问题；它不能代替科学判断或复现验证。</li>\n</ul>\n<p>任务完成后，我们再看结果怎样管理、追溯和交付。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.27.0\" target=\"_blank\" rel=\"noopener\">v0.27.0：后台长任务与结果自动回传</a><br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#core-capabilities\" target=\"_blank\" rel=\"noopener\">官方能力说明：Specialists、Delegation、可选 Reviewer 与后台执行</a>（2026-09-17 查阅）<br>用户提供的 Session Plan、Sub-agents、工具执行与 Session Reviewer 产品截图。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"12\" data-title=\"材料与结果集中管理，全过程可追溯\">\n <div class=\"kicker\">11 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">研究材料与结果集中管理，<br>全过程<span class=\"highlight-text\">可检查、可追溯</span></h2>\n <p class=\"subtitle\">材料、产物版本与执行记录保持关联；需要交付时，可打包为 .science 研究包。</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"材料、产物、来源、控制与研究包交付的五项能力\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS｜材料管理</b><small>项目文件、单文件最高 10 GiB 附件与 @ / # 引用。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS｜编辑与版本管理</b><small>文本可直接编辑、另存新版本并对比；图片可选标注修改。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE｜来源追踪</b><small>Execution Log 关联输入、代码与运行环境。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL｜操作控制</b><small>按域名设置 Notebook 与 Connector 网络边界。</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-handoff\"><span class=\"evidence-num\">05</span><span><b>HANDOFF｜研究包交付</b><small>导出 .science 包，携带会话、选定文件版本与已捕获证据。</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / REFERENCES &amp; FILES</strong><span>上传、集中管理并在研究中引用</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceMaterials|0,500,2113,780\" style=\"aspect-ratio:2113/780\"><img src=\"/open-science/assets/840a5021386b1c69.jpg\" alt=\"Open-Science Files：集中查看上传材料和生成文件，并通过 @ 在会话中引用文件\" style=\"width:100%;left:0%;top:-64.1025641025641%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / EDIT · SAVE A NEW VERSION · COMPARE</strong><span>修改并非必需；保存新版本，原版本仍可查看</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"textCompare|84,63,1494,382\" style=\"aspect-ratio:1494/382\"><img src=\"/open-science/assets/88add6d46148e7b3.jpg\" alt=\"Open-Science 白色版本对比窗口：合成演示文本保存为 v2 后，可查看相对 v1 新增的交付说明\" style=\"width:111.11111111111111%;left:-5.622489959839357%;top:-16.49214659685864%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>TEXT VERSION · v1 → v2 · SYNTHETIC DEMO</span><div class=\"evidence-example-links\"><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/26d4c8736f466d3e.jpg\" alt=\"Open-Science 文本源编辑窗口：可直接编辑 Markdown 内容并保存为新版本；合成演示\"><figcaption>查看文本编辑 ↗</figcaption></figure><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/80d177354028b914.jpg\" alt=\"Open-Science 图片产物：需要修改时，才标记位置并添加给 Agent 的修改上下文\"><figcaption>图片标注（可选）↗</figcaption></figure></div></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>从产物回到代码、工具调用和运行环境</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceProvenance|1480,0,1080,720\" style=\"aspect-ratio:1080/720\"><img src=\"/open-science/assets/acda349e68bde787.png\" alt=\"Open-Science Artifact Execution Log：保留产物对应的代码、工具调用、输入与输出\" style=\"width:237.037037037037%;left:-137.03703703703704%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>运行过程持续保留</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>研究者定义 Notebook 与 Connector 的网络边界</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceControl|580,250,1400,950\" style=\"aspect-ratio:1400/950\"><img src=\"/open-science/assets/dd683e15331a1936.png\" alt=\"Open-Science Network 设置：按域名分类管理 Notebook 与 Connector 的网络访问\" style=\"width:182.85714285714286%;left:-41.42857142857143%;top:-26.31578947368421%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · CONNECTORS · DOMAIN RULES</span><span>受控访问 · 网络保护</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-handoff\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>05 / .science RESEARCH PACKAGE</strong><span>选择导出内容，再交付可检查的研究记录</span></div><div class=\"execution-panel-body handoff-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"researchPackage|560,127,541,540\" style=\"aspect-ratio:541/540\"><img src=\"/open-science/assets/fe6e62708aaf927b.jpg\" alt=\"Open-Science 白色 Export Session package 窗口：Essential、Full 与自定义内容选项；合成产物验证演示会话\" style=\"width:306.8391866913124%;left:-103.51201478743069%;top:-23.51851851851852%;height:auto\"></figure><div class=\"handoff-detail\"><h3>.science</h3><p><b>会话与文件版本</b>携带会话分支与选定的产物、上传文件版本。</p><p><b>运行记录与已捕获证据</b>保留可用的 Notebook 记录、验证回执与环境锁。</p><p class=\"handoff-boundary\">导入后可只读检查；不会自动执行代码或恢复凭据。分享前检查包内数据。</p></div></div><div class=\"execution-panel-caption\"><span>ESSENTIAL · FULL · CUSTOMIZE CONTENTS</span><span>只读导入 · 不自动执行</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">结果可直接交付；需要时再修改，交付研究包时保留可检查的版本与记录。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看研究输出怎样管理：哪个版本可以使用，生成依据在哪里，以及怎样交给合作方。</p>\n<ul>\n <li><strong>材料管理：</strong> 输入文件和生成文件较多时，可以在项目中集中查看和引用，减少材料散落。</li>\n <li><strong>产物预览与下载：</strong> 得到图表、报告或Notebook后，可以直接检查和交付；符合要求就不必修改。</li>\n <li><strong>文本编辑与版本保存：</strong> 需要局部修订时，可以编辑支持的文本并保存新版本，同时保留原版。</li>\n <li><strong>版本对比：</strong> 想知道修订改变了什么时，可以对照前后版本，帮助检查变化。</li>\n <li><strong>图片Annotation：</strong> 图表某处需要调整时，可以标记位置并说明要求，让Agent更明确地理解修改目标；这是可选操作。</li>\n <li><strong>来源追溯：</strong> 想核查结果怎样产生时，可以查看该版本已捕获的代码、执行和环境记录，明确生成依据。</li>\n <li><strong>复现验证：</strong> 想检查计算输出能否重现时，可以针对捕获条件完整的版本重跑并比对；它不等于证明科学结论成立。</li>\n <li><strong>权限与网络控制：</strong> 使用敏感材料或外部服务时，可以检查相关访问规则和审批请求，明确工具的操作范围。</li>\n <li><strong>.science研究包：</strong> 需要向合作方交付时，可以把选定材料、产物版本和可用记录一起打包，便于对方查看；当前导入主要用于只读参考。</li>\n</ul>\n<p>这些能力汇集在Open-Science中，下面介绍它与AIPOCH其他产品和服务的关系。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>05：会话可以导出为 .science 包，携带会话分支、选定的产物和上传文件版本，以及可用的 Notebook 记录、验证回执和环境锁。Essential 默认选择必要证据；Full 包含更多可用文件，也可自定义内容。实际打包范围依选择与可用捕获记录而定；Side chat 和书签不在当前包范围中。导入需预览与确认，导入内容保持只读，不自动执行代码、恢复凭据或承诺在目标电脑自动重建运行环境。源验证回执是来源记录，不能代替目标环境重新验证；分享前检查敏感数据。</p>\n<p>本页文本编辑与 Compare 截图来自 2026-09-17 本地 v0.30.2 的合成 Markdown 演示：上传演示文本后直接编辑并保存，确认生成 v2、保留 v1，且可查看新增说明。截图并不声称该文本由 Agent 生成，也不表示科学发现。研究包截图来自本地合成产物验证会话的导出选项窗口，仅展示导出内容选择，不代表本次另行完成跨机器导入或验证。</p>\n[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.25.0\" target=\"_blank\" rel=\"noopener\">v0.25.0：文本源编辑、保存新版本与 Compare</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.29.0\" target=\"_blank\" rel=\"noopener\">v0.29.0：.science 包、可选导出内容与只读导入</a><br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#core-capabilities\" target=\"_blank\" rel=\"noopener\">官方能力说明：文件限制、产物来源与研究包边界</a>（2026-09-17 查阅）<br><a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">PR #1815：可选 Annotation</a><br>本地白色界面实拍：文本编辑、v2 对比及研究包导出选项（2026-09-17）；保留此前用户提供的 Files、Annotation、Execution Log 与 Network 截图。\n</details>\n </aside>\n</section>\n\n<section class=\"slide architecture\" data-page=\"13\" data-title=\"AIPOCH 构建开放的科研基础设施\">\n <div class=\"kicker\">12 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH 构建<span class=\"highlight-text\">开放的科研基础设施</span></h2>\n <p class=\"subtitle\">Open-Science 是面向研究者与全球社区的开放入口，底层由专业能力、执行引擎与技术服务共同支撑。</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH 产品架构建筑：服务、能力、执行与开放科研空间\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>面向研究者的开放科研工作台与社区入口<span class=\"benchmark-result\"><b>#1</b>OPEN-SCIENCE · BIOMNIBENCH-DA PUBLIC 50</span></p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">SOON</span></h3><p>即将把专业能力组织为可执行、可恢复的科研 Workflow</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>MedSkillAudit：Skill 审计与评分 · Benchmark / Leaderboard 公开入口</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Model · Agent · Compute</h3><p>Environment · Data：提供运行环境与数据服务</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>全球科研开源社区</strong>　贡献 · 验证 · 协作 · 复用</div></div>\n <p class=\"summary\">AIPOCH 将模型、工具与科研经验组织成可执行的科学能力，并通过 Open-Science 向全球社区开放。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看AIPOCH的整体产品布局，区分研究工作台、专业能力、审计服务和后续建设方向。</p>\n<ul>\n <li><strong>Open-Science：</strong> 研究者直接使用的工作台，把材料、方法、工具执行和结果检查连接起来。</li>\n <li><strong>Specialists、Skills与Connectors：</strong> 提供专业方法和工具连接，支撑工作台完成不同类型的任务。</li>\n <li><strong>MedSkillAudit：</strong> 提供Skill审计、评分与公开评测入口，帮助使用者了解能力的评价依据。</li>\n <li><strong>MedFlow：</strong> 是计划中的可恢复科研工作流方向，当前页面标注SOON。</li>\n <li>Open-Science在BiomniBench-DA Public 50评测中取得了第一名。这是特定评测范围内的成绩，我们也希望通过更多真实研究任务持续检验和改进产品。</li>\n</ul>\n<p>产品能力的完善，需要真实问题和专业经验持续参与。下面看不同角色可以怎样合作。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>这是概念架构，不是实际部署拓扑。建筑外围代表全球科研开源社区，参与能力贡献、验证、协作与复用。</p>\n[Sources]<br>年中汇报建筑图 page8-architecture-20260730-bgmatch.png；用户确认的架构迁移概念与产品状态；Open-Science v0.26.0 产品资料；BiomniBench-DA Public 50 第一名信息由 AIPOCH 提供；<a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH 官网</a>。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"14\" data-title=\"全球社区共同扩展能力边界\">\n <div class=\"kicker\">13 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">全球社区，共同扩展<span class=\"highlight-text\">能力边界</span></h2>\n <p class=\"subtitle\">社区贡献专业能力，AIPOCH 提供持续共建的基础设施与协作机制。</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>研究者</h3><p>使用社区贡献的科研能力，<br>并反馈真实问题。</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>领域专家</h3><p>将方法、规则与经验整理为<br>Specialist 或 Skill。</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>开发者</h3><p>接入工具、数据源与<br>工作流组件。</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>科研机构</h3><p>参与验证、复现与<br>合作研究。</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH 像素贴纸：AIPOCH 社区支持\"><div><span>AIPOCH / COMMUNITY INITIATOR</span><b>作为社区的发起者<br>与推动者</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>开放基础设施</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>线上线下 Workshop</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>课题组项目合作</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skills Hub<br>Specialist Marketplace</strong></div></div></div>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看不同参与者具体怎样合作，重点是把真实问题与专业方法带进来。</p>\n<ul>\n <li><strong>研究者：</strong> 可以提供实际任务和使用反馈，让产品改进围绕研究中遇到的问题。</li>\n <li><strong>领域专家：</strong> 可以从一个成熟方法开始，明确步骤、输入要求、适用边界和检查标准，与团队共同整理、测试和迭代。</li>\n <li><strong>开发者：</strong> 可以接入工具和数据源，让更多现有科研资源能够用于任务执行。</li>\n <li><strong>科研机构：</strong> 可以围绕具体课题开展验证、复现和联合研究，把能力放到实际场景中检验。</li>\n <li>AIPOCH通过基础设施、Workshops、Co-research和能力市场支持这些合作，方法是否公开发布由参与者另行决定。</li>\n</ul>\n<p>当合作中的方法和经验被保留下来，就有机会支持下一项研究。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n\n[Sources]<br>用户明确的全球科研开源社区定位、四类共建角色及 AIPOCH 社区支持方案；视觉素材由用户提供并处理为像素贴纸。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"15\" data-title=\"一次贡献，成为下一次发现的起点\">\n <div class=\"kicker\">14 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">一次贡献，可以成为<br>下一次<span class=\"highlight-text\">科学发现的起点</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">让真实研究中的方法与经验，经过验证、发布和复用，持续回到新的研究中。</p><div class=\"participation\"><div><b>USE</b><span>使用开放能力</span></div><div><b>CONTRIBUTE</b><span>贡献方法与组件</span></div><div><b>VALIDATE</b><span>审查、复现与反馈</span></div><div><b>CO-CREATE</b><span>围绕真实问题合作</span></div></div><p class=\"fine\" style=\"margin-top:29px\">我们希望与全球社区共同建立的协作机制。</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">共享的<br>科研能力<small>REUSABLE · VERIFIABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>真实问题</span><small>从科研需求出发</small></div><div class=\"wheel-node wn2\"><b>02</b><span>协作研究</span><small>连接不同专业</small></div><div class=\"wheel-node wn3\"><b>03</b><span>沉淀能力</span><small>Skill / Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>审查验证</span><small>方法、边界与结果</small></div><div class=\"wheel-node wn5\"><b>05</b><span>发布复用</span><small>保留来源与版本</small></div><div class=\"wheel-node wn6\"><b>06</b><span>反馈改进</span><small>新的案例与贡献</small></div></div></div>\n <p class=\"summary\">让一次研究积累的经验，成为更多研究者可以继续使用的能力。</p>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">这里，我们主要来看一次合作之后，怎样把方法和反馈积累下来，支持后续研究。</p>\n<ul>\n <li>一项真实任务可以带来新的方法或改进建议，经过整理、测试后，成为其他任务可以按需使用的能力。</li>\n <li>复用时应保留版本、来源和适用条件，避免把一次有效的方法直接推广到所有场景。</li>\n <li>后续使用者遇到的新问题，可以帮助贡献者继续改进方法。</li>\n <li>更广泛的能力共享与跨机构实时协作，是我们继续建设的方向，不能当作当前已经全面可用的功能。</li>\n</ul>\n<p>最后，也邀请大家从自己的研究任务或成熟方法开始参与。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>这页表达希望共同形成的社区机制，不表示所有审核、发布、治理和合作流程都已作为产品功能上线。Hosted Public Skill Commons 与跨机构实时协作仍属于未来建设方向。</p>\n[Sources]<br>用户确认的社区愿景、共建循环与未来建设方向。\n</details>\n </aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"16\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"连接全球社区的开放科研基础设施\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">让专业科研能力触手可及，<br>让选择权回到研究者手中。</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN-SOURCE<br>RESEARCH COMMUNITY<span class=\"version\">PRODUCT SNAPSHOT<br>v0.30.2 · 2026.09.17</span></div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>使用 Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>参与开源共建 ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>开展科研合作 ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"扫描二维码访问 Open-Science 官方产品页面\"><p>扫描进入 Open-Science</p></a>\n <aside class=\"notes\">\n<p class=\"speaker-summary\">今天的介绍就到这里。我们希望让专家的方法进入实际执行，让研究过程和产物留下可以检查的依据，同时让研究者保留技术选择和科学判断。</p>\n<ul>\n <li>如果您正在开展研究，可以带一项已有论文、数据或分析目标的任务，与我们讨论怎样在Open-Science中推进。</li>\n <li>如果您已有成熟的专业方法，也欢迎与我们一起明确它的适用条件和评价标准，讨论怎样整理成可复用的科研能力。</li>\n</ul>\n<p>我们可以从一个具体问题开始，共同讨论怎样落地。谢谢大家，欢迎交流。</p>\n<details class=\"sources\"><summary>来源与演示说明</summary>\n<p>本版介绍对应 Open-Science v0.30.2，更新日期为 2026.09.17。部分界面沿用历史截图，具体版本与来源见各页讲稿。二维码指向 https://aipoch.com/open-science。所有产品内容用于科学研究介绍，研究输出仍需专业审阅。</p>\n[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science 官方产品页</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">开源仓库</a><br><a href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\">官方联系入口</a><br>建筑素材：AIPOCH 年中汇报。\n</details>\n </aside>\n</section>\n</main></div>\n<div class=\"key-hint\">← → 翻页　O 目录　N 讲稿　F 全屏</div>\n<nav class=\"controls\" aria-label=\"演示控制\"><button id=\"prevBtn\" aria-label=\"上一页\" title=\"上一页（←）\">←</button><span id=\"slideCounter\" class=\"counter\" aria-live=\"polite\">01 / 16</span><button id=\"nextBtn\" aria-label=\"下一页\" title=\"下一页（→）\">→</button><span class=\"sep\"></span><button id=\"overviewBtn\" aria-label=\"打开目录\" title=\"目录（O）\">目录</button><button id=\"notesBtn\" aria-label=\"打开讲稿\" title=\"讲稿与来源（N）\">讲稿</button><button id=\"fullBtn\" aria-label=\"全屏演示\" title=\"全屏（F）\">全屏</button><button id=\"helpBtn\" aria-label=\"使用帮助\" title=\"快捷键与打印\">?</button></nav>\n<dialog id=\"overviewDialog\" aria-labelledby=\"overviewTitle\"><div class=\"dialog-head\"><h2 id=\"overviewTitle\">Open-Science · 16 页目录</h2><button data-close=\"overviewDialog\" aria-label=\"关闭目录\">关闭 ×</button></div><div id=\"overviewGrid\" class=\"overview-grid\"></div></dialog>\n<dialog id=\"notesDialog\" aria-labelledby=\"notesTitle\"><div class=\"dialog-head\"><h2 id=\"notesTitle\">讲稿与来源</h2><button data-close=\"notesDialog\" aria-label=\"关闭讲稿\">关闭 ×</button></div><div id=\"notesContent\" class=\"notes-content\"></div></dialog>\n<dialog id=\"imageDialog\" aria-labelledby=\"imageTitle\"><div class=\"dialog-head\"><h2 id=\"imageTitle\">产品截图</h2><button data-close=\"imageDialog\" aria-label=\"关闭截图\">关闭 ×</button></div><div id=\"imageZoom\"></div></dialog>\n<dialog id=\"helpDialog\" aria-labelledby=\"helpTitle\"><div class=\"dialog-head\"><h2 id=\"helpTitle\">演示帮助</h2><button data-close=\"helpDialog\" aria-label=\"关闭帮助\">关闭 ×</button></div><div class=\"help-list\"><div><kbd>← / →</kbd>上一页 / 下一页</div><div><kbd>Space</kbd>下一页</div><div><kbd>Home / End</kbd>首页 / 末页</div><div><kbd>O</kbd>打开或关闭目录</div><div><kbd>N</kbd>打开或关闭讲稿</div><div><kbd>F</kbd>进入或退出全屏</div><div><kbd>H</kbd>隐藏或显示控制条</div><div><kbd>Esc</kbd>关闭浮层</div></div><p style=\"font-size:16px;color:#777;line-height:1.8;margin-top:25px\">触屏可左右滑动翻页。第 06—12 页可点击标签切换产品功能与真实截图；点击页面内截图可查看完整原图。图片与样式已嵌入，文件可离线打开；访问外部链接需要网络。浏览器打印可输出全部 16 页，建议开启背景图形。</p><button id=\"printBtn\" style=\"margin-top:20px;border:1px solid #ccc;background:#f1dd67;padding:11px 19px;color:#111\">打印 / 保存为 PDF</button></dialog>\n<div id=\"toast\" class=\"toast\" role=\"status\"></div>\n<script>\n(()=>{'use strict';\n const slides=[...document.querySelectorAll('.slide')], deck=document.getElementById('deck');\n const total=slides.length, dialogs=[...document.querySelectorAll('dialog')];\n let current=0, touchX=0, touchY=0, touchTarget=null, toastTimer;\n const clamp=n=>Math.max(0,Math.min(total-1,n));\n function fit(){document.documentElement.style.setProperty('--scale',String(Math.min(innerWidth/1600,innerHeight/900)));}\n function syncNotes(){document.getElementById('notesTitle').textContent=`${String(current+1).padStart(2,'0')} / ${slides[current].dataset.title}`;document.getElementById('notesContent').innerHTML=slides[current].querySelector('.notes').innerHTML;}\n function showSlide(n,updateHash=true){current=clamp(n);slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true');s.inert=i!==current;});deck.classList.toggle('chrome-light',!slides[current].classList.contains('slide-dark'));document.getElementById('slideCounter').textContent=`${String(current+1).padStart(2,'0')} / ${total}`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===total-1;document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';document.querySelectorAll('.overview-item').forEach((b,i)=>b.setAttribute('aria-current',i===current?'true':'false'));if(updateHash){try{history.replaceState(null,'',`#slide-${String(current+1).padStart(2,'0')}`);}catch{}}syncNotes();}\n function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}\n function toggleDialog(id){const d=document.getElementById(id);if(d.open){d.close();return;}dialogs.forEach(x=>x.open&&x.close());if(id==='notesDialog')syncNotes();d.showModal();}\n async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('当前浏览器不支持全屏，请使用浏览器的全屏菜单。');}catch{toast('可使用浏览器菜单进入全屏。');}}\n document.getElementById('prevBtn').addEventListener('click',()=>showSlide(current-1));document.getElementById('nextBtn').addEventListener('click',()=>showSlide(current+1));document.getElementById('overviewBtn').addEventListener('click',()=>toggleDialog('overviewDialog'));document.getElementById('notesBtn').addEventListener('click',()=>toggleDialog('notesDialog'));document.getElementById('fullBtn').addEventListener('click',fullscreen);document.getElementById('helpBtn').addEventListener('click',()=>toggleDialog('helpDialog'));document.getElementById('printBtn').addEventListener('click',()=>{document.getElementById('helpDialog').close();window.print();});\n document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));\n document.querySelectorAll('.slide .shot').forEach(shot=>{shot.setAttribute('role','button');shot.setAttribute('tabindex','0');shot.setAttribute('aria-label','查看完整产品截图');shot.setAttribute('title','点击查看未裁切的完整原图');const open=()=>{const source=shot.matches('.crop')?shot:shot.querySelector('.gallery-panel.active .crop');if(!source)return;const sourceImage=source.querySelector('img');if(!sourceImage)return;const full=document.createElement('figure');full.className='full-image-zoom';const image=sourceImage.cloneNode(true);image.removeAttribute('style');const width=sourceImage.naturalWidth||1,height=sourceImage.naturalHeight||1;full.style.setProperty('--zoom-ratio',String(width/height));full.append(image);document.getElementById('imageZoom').replaceChildren(full);document.getElementById('imageTitle').textContent=sourceImage.alt;toggleDialog('imageDialog');};shot.addEventListener('click',open);shot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();open();}});});\n dialogs.forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));\n const overview=document.getElementById('overviewGrid');slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-item';b.setAttribute('aria-label',`跳转第${i+1}页 ${s.dataset.title}`);const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const text=document.createElement('span');text.textContent=s.dataset.title;b.append(num,text);b.addEventListener('click',()=>{showSlide(i);document.getElementById('overviewDialog').close();});overview.append(b);});\n const journey=document.querySelector('[data-research-journey]');\n if(journey){\n  const steps=[...journey.querySelectorAll('[data-journey-step]')];\n  const panels=[...journey.querySelectorAll('[data-journey-panel]')];\n  function selectJourney(index,moveFocus=false){\n   steps.forEach((step,i)=>{const active=i===index;st esentation in a browser with JavaScript enabled.</div></noscript>\n<div id=\"viewport\"><main id=\"deck\" aria-label=\"AIPOCH Open-Science product introduction\">\n<div class=\"progress-bar-nav\"><div id=\"progressFill\" class=\"progress-bar-fill\"></div></div>\n<nav class=\"nav-bar\" aria-label=\"Brand\"><a class=\"nav-logo\" href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\"><span class=\"brand-mark\"><img src=\"/open-science/assets/e3824afb44bd1b7c.png\" alt=\"\"></span>AIPOCH</a><div class=\"nav-context\">OPEN-SCIENCE · PRODUCT & COMMUNITY · 2026.09</div></nav>\n\n<section class=\"slide slide-dark cover active\" data-page=\"01\" data-title=\"AIPOCH · Open-Science\" aria-label=\"Slide 1: AIPOCH Open-Science\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div>\n <img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Architectural linework representing open research infrastructure\">\n <div class=\"brand-lead\">AIPOCH <span style=\"font:12px var(--mono);letter-spacing:.17em;color:#aaa;vertical-align:middle;margin-left:22px\">AI4SCIENCE</span></div>\n <h1 class=\"hero-title\"><span class=\"highlight-text en\">Open-Science</span></h1>\n <p class=\"cover-sub\">An open-source, model-agnostic workbench for real research</p>\n <p class=\"manifesto\">Put research expertise to work.<br>On your terms.</p>\n <span class=\"radar-node decor\" style=\"left:1120px;top:252px\"></span><span class=\"radar-node decor\" style=\"left:1455px;top:482px\"></span><span class=\"radar-node decor\" style=\"left:1230px;top:706px\"></span>\n <div class=\"cover-meta\">OPEN BY DESIGN. BUILT WITH THE RESEARCH COMMUNITY.</div>\n <p class=\"cover-label\">A shared workbench for<br>a global open research community</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH is building Open-Science so researchers everywhere can use, inspect and improve scientific capabilities together.</p><p>The opening establishes the relationship between the company and the product. AIPOCH is an AI4Science company; Open-Science is its open-source, model-agnostic workbench for researchers. This presentation focuses on the product, the capabilities it brings together and the community growing around it.</p><p>“Model-agnostic” means researchers can choose models, providers and deployment paths. It does not mean the product works without models or that third-party inference and compute are free.</p><div class=\"sources\">[Sources]<br>Company and product definitions supplied by AIPOCH. Architecture artwork: AIPOCH 2026 mid-year review. Visual reference: AIPOCH — Skill Infrastructure for Medical Research.</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"02\" data-title=\"Scientific expertise, made executable\">\n <div class=\"kicker\">01 / ABOUT AIPOCH</div>\n <h2 class=\"section-title\">Scientific expertise, <span class=\"highlight-text\">made executable</span></h2>\n <p class=\"mission-intro\">AIPOCH builds AI4Science products that pair machine computation and reasoning with the judgment researchers develop through years of practice. We turn scattered knowledge, tools and workflows into scientific capabilities that can be run, inspected and reused.</p>\n <div class=\"mission-formula\">\n  <div class=\"formula-part\"><span class=\"label\">MACHINE INTELLIGENCE</span><div class=\"en-big\">AI Compute<br>& Reasoning</div><div class=\"cn\">Compute · Reason · Execute</div></div><div class=\"formula-symbol\">×</div>\n  <div class=\"formula-part\"><span class=\"label\">HUMAN EXPERTISE</span><div class=\"en-big\">Research<br>Judgment</div><div class=\"cn\">Methods · Standards · Boundaries</div></div><div class=\"formula-symbol\">→</div>\n  <div class=\"formula-part formula-result\"><span class=\"label\" style=\"color:#655b2b\">SCIENTIFIC CAPABILITY</span><div class=\"en-big\">Knowledge you can run.<br>Expertise you can reuse.</div><di
