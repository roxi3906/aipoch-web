ructure<br>together</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>Open infrastructure</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>Online &amp; in-person workshops</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>Collaborative projects with research groups</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skills Hub<br>Specialist Marketplace</strong></div></div></div>\n <aside class=\"notes\"><p class=\"speaker-summary\">The community contributes scientific capability; AIPOCH provides infrastructure, programs and collaboration mechanisms that help co-creation continue.</p><p>The community has four roles: researchers, domain experts, developers and research institutions. Researchers use capabilities and return real problems. Domain experts codify Specialists and Skills. Developers connect tools, data sources and workflow components. Institutions support validation, reproduction and collaborative research.</p><p>AIPOCH is not a fifth community role. It convenes and supports the community through open infrastructure, online and in-person workshops, research-group collaborations, a Skills Hub and a Specialist Marketplace. Contributors decide what to publish; private research data does not have to be made public. Research collaborations are agreed project by project.</p><div class=\"sources\">[Sources]<br>Global open research community positioning, four contribution roles and AIPOCH support model specified by AIPOCH. Pixel-sticker artwork supplied and adapted for this deck.</div></aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"15\" data-title=\"What one project learns can move the next one forward\">\n <div class=\"kicker\">14 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">What one project learns can<br><span class=\"highlight-text\">move the next one forward</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">Once methods and hard-won research practice are tested and shared, they do not have to disappear into a final report.</p><div class=\"participation\"><div><b>USE</b><span>Apply an existing capability</span></div><div><b>CONTRIBUTE</b><span>Share a method or component</span></div><div><b>VALIDATE</b><span>Review, reproduce, challenge</span></div><div><b>CO-CREATE</b><span>Work together on a real question</span></div></div><p class=\"fine\" style=\"margin-top:29px\">A model AIPOCH aims to build with the global research community.</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">Shared<br>capability<small>TESTED · REUSABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>Research question</span><small>Start with a real need</small></div><div class=\"wheel-node wn2\"><b>02</b><span>Collaborate</span><small>Bring the right disciplines together</small></div><div class=\"wheel-node wn3\"><b>03</b><span>Package the method</span><small>Skill or Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>Test it</span><small>Methods, limits, results</small></div><div class=\"wheel-node wn5\"><b>05</b><span>Publish &amp; reuse</span><small>Keep source and version</small></div><div class=\"wheel-node wn6\"><b>06</b><span>Learn from use</span><small>New cases, better capability</small></div></div></div>\n <p class=\"summary\">Let the next researcher begin with everything the last project learned.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">When a method is tested, documented and shared, the next project can start with more than a blank page.</p><p>The community loop begins with a real question, moves through collaborative research, packaging, testing and publication, then improves through new use. Contributions can take the form of Specialists, Skills, Connectors or Workflows.</p><p>This slide describes the collaboration model AIPOCH aims to build. It does not imply that every review, publishing, governance or partnership workflow is already available as a product feature. A hosted public Skill Commons and live cross-institution collaboration remain future directions.</p><div class=\"sources\">[Sources]<br>Community vision, contribution loop and future directions confirmed by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"16\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Open research infrastructure connected to a global community\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">Put research expertise to work.<br>On your terms.</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN RESEARCH<br>COMMUNITY<span class=\"version\">PRODUCT SNAPSHOT<br>v0.30.2 · 2026.09.17</span></div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>Explore Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>Build with us on GitHub ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>Partner with AIPOCH ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"QR code for the Open-Science product page\"><p>Explore Open-Science</p></a>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open research compounds: each reusable capability gives the next project a stronger starting point.</p><p>The close offers three next steps: explore Open-Science, build with the community on GitHub, or speak with AIPOCH about a research collaboration.</p><p>Updated for Open-Science v0.30.2 on September 17, 2026. Some interfaces use historical screenshots, with versions and sources in the relevant slide notes. The QR code points to https://aipoch.com/open-science. Product content is presented for scientific research use; research outputs still require professional review.</p><div class=\"sources\">[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science product page</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-source repository</a><br><a href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\">AIPOCH contact page</a><br>Architecture artwork: AIPOCH 2026 mid-year review.</div></aside>\n</section>\n</main></div>\n<div class=\"key-hint\">← → SLIDES　O OVERVIEW　N NOTES　F FULLSCREEN</div>\n<nav class=\"controls\" aria-label=\"Presentation controls\"><button id=\"prevBtn\" aria-label=\"Previous slide\" title=\"Previous slide (←)\">←</button><span id=\"slideCounter\" class=\"counter\" aria-live=\"polite\">01 / 16</span><button id=\"nextBtn\" aria-label=\"Next slide\" title=\"Next slide (→)\">→</button><span class=\"sep\"></span><button id=\"overviewBtn\" aria-label=\"Open overview\" title=\"Overview (O)\">Overview</button><button id=\"notesBtn\" aria-label=\"Open speaker notes\" title=\"Speaker notes and sources (N)\">Notes</button><button id=\"fullBtn\" aria-label=\"Present fullscreen\" title=\"Fullscreen (F)\">Full</button><button id=\"helpBtn\" aria-label=\"Open help\" title=\"Shortcuts and print\">?</button></nav>\n<dialog id=\"overviewDialog\" aria-labelledby=\"overviewTitle\"><div class=\"dialog-head\"><h2 =[...commons.querySelectorAll('[data-role]')];\n  const stage=commons.querySelector('.commons-art-stage');\n  const imageSource=stage.querySelector('.commons-art-base').src;\n  const zones=[],regionButtons=[];\n  Object.entries(zoneMasks).forEach(([key,polygons])=>polygons.forEach(points=>{\n   const clip='polygon('+points.map(([x,y])=>(x/1668*100).toFixed(3)+'% '+(y/943*100).toFixed(3)+'%').join(',')+')';\n   const zone=document.createElement('img');zone.className='commons-zone';zone.dataset.zone=key;zone.alt='';zone.setAttribute('aria-hidden','true');zone.src=imageSource;zone.style.clipPath=clip;stage.append(zone);zones.push(zone);\n   const region=document.createElement('button');region.className='commons-region';region.dataset.region=key;region.tabIndex=-1;region.setAttribute('aria-label','View how '+roles[key].name+' contribute');region.setAttribute('aria-controls','commonsContext');region.style.clipPath=clip;stage.append(region);regionButtons.push(region);\n  }));\n  function displayRole(key){\n   const role=roles[key];commons.dataset.focus=key||'';\n   buttons.forEach(b=>{\n    b.classList.toggle('is-focused',b.dataset.role===key);\n    b.setAttribute('aria-pressed',b.dataset.role===pinned?'true':'false');\n   });\n   zones.forEach(zone=>zone.classList.toggle('is-lit',zone.dataset.zone===key));\n   document.getElementById('commonsContext').textContent=role?role.text:'Choose a role to see how each group contributes.';\n  }\n  function bindControl(control,key){\n   control.setAttribute('aria-controls','commonsContext');\n   control.addEventListener('pointerenter',()=>displayRole(key));\n   control.addEventListener('pointerleave',()=>displayRole(pinned));\n   control.addEventListener('focus',()=>displayRole(key));\n   control.addEventListener('click',()=>{pinned=pinned===key?'':key;displayRole(pinned);});\n   control.addEventListener('blur',()=>displayRole(pinned));\n   control.addEventListener('keydown',e=>{\n    if(!['ArrowLeft','ArrowRight','Home','End'].incl  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();showSlide(current-1);}else if(e.key==='Home'){e.preventDefault();showSlide(0);}else if(e.key==='End'){e.preventDefault();showSlide(total-1);}});\n document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;touchTarget=e.target;},{passive:true});document.addEventListener('touchend',e=>{if(dialogs.some(d=>d.open)||!touchTarget||touchTarget.closest('button,a,.controls'))return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)showSlide(current+(dx<0?1:-1));},{passive:true});\n function fromHash(){const m=location.hash.match(/^#slide-(\\d{1,2})$/);showSlide(m?parseInt(m[1],10)-1:0,false);}window.addEventListener('hashchange',fromHash);window.addEventListener('resize',fit);window.addEventListener('fullscreenchange',fit);fit();fromHash();\n})();\n<\/script>\n</body>\n</html>\n"};
const frames={zh:document.getElementById('deck-zh'),en:document.getElementById('deck-en')};
const loading=document.getElementById('loading');
const validHash=hash=>/^#slide-\d{2}$/.test(hash||'')?hash:'#slide-01';
const params=new URLSearchParams(location.search);
let stored='';
try{stored=localStorage.getItem('aipoch-deck-language')||''}catch{}
let activeLang=['zh','en'].includes(params.get('lang'))?params.get('lang'):(['zh','en'].includes(stored)?stored:(navigator.language.toLowerCase().startsWith('zh')?'zh':'en'));
let currentHash=validHash(location.hash);
const ready={zh:false,en:false};

function childHash(lang){
  try{
    const active=frames[lang].contentDocument.querySelector('.slide.active');
    if(active&&/^\d{2}$/.test(active.dataset.page||''))return '#slide-'+active.dataset.page;
    return validHash(frames[lang].contentWindow.location.hash);
  }catch{return currentHash}
}

function syncParentHash(hash){
  currentHash=validHash(hash);
  const url=new URL(location.href);
  url.searchParams.set('lang',activeLang);
  url.hash=currentHash;
  if(location.href!==url.href)history.replaceState(null,'',url);
}

function controlMarkup(lang){
  return '<div class="os-language-switch" role="group" aria-label="Switch presentation language">'+
    '<button type="button" data-deck-language="zh" aria-label="切换到中文版">中文</button>'+
    '<button type="button" data-deck-language="en" aria-label="Switch to English">EN</button>'+
    '</div>';
}

function installControl(lang){
  const doc=frames[lang].contentDocument;
  if(!doc||doc.getElementById('os-bilingual-control'))return;
  const style=doc.createElement('style');
  style.id='os-bilingual-control';
  style.textContent='.os-language-switch{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.26);border-radius:999px;background:rgba(17,17,17,.78);box-shadow:0 5px 20px rgba(0,0,0,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:Arial,Helvetica,sans-serif}.os-language-switch button{min-width:48px;height:26px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.72);font:600 11px/26px Arial,Helvetica,sans-serif;letter-spacing:.04em;cursor:pointer}.os-language-switch button:hover{color:#fff}.os-language-switch button.is-active{background:#f5df5e;color:#111}.os-language-switch button:focus-visible{outline:2px solid #f5df5e;outline-offset:2px}@media(max-width:760px){.os-language-switch{top:10px}.os-language-switch button{min-width:43px;height:24px;line-height:24px;padding:0 9px}}';
  doc.head.appendChild(style);
  const holder=doc.createElement('div');
  holder.innerHTML=controlMarkup(lang);
  const control=holder.firstElementChild;
  doc.body.appendChild(control);
  control.querySelectorAll('button').forEach(button=>button.addEventListener('click',event=>{
    event.preventDefault();
    event.stopPropagation();
    void window.__switchDeckLanguage(button.dataset.deckLanguage);
  }));
  updateControls();
}

function updateControls(){
  Object.values(frames).forEach(frame=>{
    try{
      frame.contentDocument.querySelectorAll('[data-deck-language]').forEach(button=>{
        const selected=button.dataset.deckLanguage===activeLang;
        button.classList.toggle('is-active',selected);
        button.setAttribute('aria-pressed',String(selected));
      });
    }catch{}
  });
}

async function exitFullscreen(){
  try{if(document.fullscreenElement)await document.exitFullscreen()}catch{}
  for(const frame of Object.values(frames)){
    try{if(frame.contentDocument.fullscreenElement)await frame.contentDocument.exitFullscreen()}catch{}
  }
}

async function setLanguage(lang,{exitFull=true}={}){
  if(!['zh','en'].includes(lang))return;
  const previous=activeLang;
  if(ready[previous])currentHash=childHash(previous);
  if(exitFull)await exitFullscreen();
  activeLang=lang;
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  frames.zh.hidden=lang!=='zh';
  frames.en.hidden=lang!=='en';
  if(ready[lang]){
    try{frames[lang].contentWindow.location.hash=currentHash}catch{}
    loading.hidden=true;
  }
  try{localStorage.setItem('aipoch-deck-language',lang)}catch{}
  syncParentHash(currentHash);
  updateControls();
}

window.__switchDeckLanguage=setLanguage;

Object.entries(frames).forEach(([lang,frame])=>{
  frame.addEventListener('load',()=>{
    ready[lang]=true;
    try{
      frame.contentWindow.location.hash=currentHash;
      frame.contentWindow.addEventListener('hashchange',()=>{
        if(lang===activeLang)syncParentHash(frame.contentWindow.location.hash);
      });
    }catch{}
    installControl(lang);
    try{
      const root=frame.contentDocument.querySelector('main')||frame.contentDocument.body;
      const observer=new frame.contentWindow.MutationObserver(()=>{
        if(lang===activeLang)syncParentHash(childHash(lang));
      });
      observer.observe(root,{subtree:true,attributes:true,attributeFilter:['class','aria-hidden']});
    }catch{}
    if(lang===activeLang){frame.hidden=false;loading.hidden=true}
  });
  frame.srcdoc=documents[lang];
});

window.addEventListener('hashchange',()=>{
  currentHash=validHash(location.hash);
  try{frames[activeLang].contentWindow.location.hash=currentHash}catch{}
});

void setLanguage(activeLang,{exitFull:false});
</script>
