v class=\"cn\">Tested and refined in real research</div></div>\n </div>\n <p class=\"summary\">Put proven research practice to work, so the next study doesn't start from scratch.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">AIPOCH turns expert practice into capability researchers can actually call and run.</p><p>AI contributes computation, reasoning, information processing and execution. Researchers contribute methods, domain knowledge, standards of judgment and boundaries of use. Together, they allow scientific know-how to enter real tasks, be inspected and be reused across studies.</p><p>Open-Science is where researchers use these capabilities—and where the community can improve them over time.</p><div class=\"sources\">[Sources]<br>AIPOCH company definition and product materials supplied for the 2026 mid-year review.</div></aside>\n</section>\n\n<section class=\"slide slide-surface\" data-page=\"03\" data-title=\"A better model won't fix a broken research workflow\">\n <div class=\"kicker\">02 / THE RESEARCH GAP</div>\n <h2 class=\"section-title\">A better model won't fix<br><span class=\"highlight-text\">a broken research workflow</span></h2>\n <p class=\"subtitle\">The hard part is keeping evidence, methods, tools, compute and outputs connected.</p>\n <div class=\"fragmented\">\n  <div class=\"fragment\"><div class=\"index\">01</div><h3>Question</h3><div class=\"en\">INTENT</div><p class=\"gap-note\">Research goals<br>restated in every tool</p></div>\n  <div class=\"fragment\"><div class=\"index\">02</div><h3>Evidence</h3><div class=\"en\">SOURCES</div><p class=\"gap-note\">Papers and datasets<br>scattered across systems</p></div>\n  <div class=\"fragment\"><div class=\"index\">03</div><h3>Method</h3><div class=\"en\">DESIGN</div><p class=\"gap-note\">Expert practice<br>often undocumented</p></div>\n  <div class=\"fragment\"><div class=\"index\">04</div><h3>Analysis</h3><div class=\"en\">EXECUTION</div><p class=\"gap-note\">Code and environments<br>difficult to reproduce</p></div>\n  <div class=\"fragment\"><div class=\"index\">05</div><h3>Validation</h3><div class=\"en\">CHECKS</div><p class=\"gap-note\">Methods and outputs<br>hard to reconcile</p></div>\n  <div class=\"fragment\"><div class=\"index\">06</div><h3>Outputs</h3><div class=\"en\">ARTIFACTS</div><p class=\"gap-note\">Files and provenance<br>difficult to reuse</p></div>\n </div>\n <p class=\"problem-foot\">What gets lost: <span style=\"color:#111\">context, continuity, execution state and provenance</span></p>\n <p class=\"summary\">A research workbench should carry the work forward, not reset at every tool boundary.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Research needs an environment that carries the work forward across tools, sessions and execution steps.</p><p>This is not a claim that every AI chat tool is unable to execute. The point is that research still depends on persistent context, specialist methods, compute and validation. Researchers are often left to move information, configure environments, check methods and assemble outputs themselves.</p><div class=\"sources\">[Sources]<br>Narrative confirmed by AIPOCH; structure adapted from the “Fragmented Research Workflow” in the reference deck.</div></aside>\n</section>\n\n<section class=\"slide\" data-page=\"04\" data-title=\"Start with a question. Get straight to the work.\">\n <div class=\"kicker\">03 / MEET OPEN-SCIENCE</div>\n <h2 class=\"section-title\">Start with a question.<br><span class=\"highlight-text\">Get straight to the work.</span></h2>\n <p class=\"subtitle\">Open-Science brings models, specialist expertise and real research workflows into one place.</p>\n <div class=\"content split wide-visual\">\n  <div class=\"overview-copy\"><p class=\"body-text\">Open-Science is AIPOCH’s open-source, model-agnostic workbench for research.<br><br>Choose the tools that fit the study. Inspect the work. For verifiable artifact versions, rerun the computation and compare outputs.</p><div class=\"key-values\"><div class=\"key-value\"><b>Open source</b><span>CODE YOU CAN INSPECT</span></div><div class=\"key-value\"><b>Model-agnostic</b><span>CHOOSE WHAT FITS</span></div><div class=\"key-value\"><b>Transparent</b><span>SEE EACH STEP</span></div><div class=\"key-value\"><b>Reproducibility</b><span>RERUN &amp; COMPARE OUTPUTS</span></div></div></div>\n  <div><figure class=\"crop shot workbench-home full-gif\"><img alt=\"Open-Science v0.30.2: real home, artifact and per-version reproducibility interfaces\" src=\"/open-science/assets/b720e64f75f220b1.gif\"></figure><div class=\"shot-caption\"><span>OPEN-SCIENCE · ARTIFACT VERIFICATION</span><span>REAL UI · CLICK TO ENLARGE</span></div><div class=\"product-rail\"><span>Projects</span><span>Artifacts</span><span>Provenance</span><span>Verification</span></div></div>\n </div>\n <p class=\"summary\">One workspace for the question, the expertise, the execution and the evidence.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science brings the project, tools, computation and outputs together. Reproducibility checks apply to individual artifact versions.</p><p>For verifiable versions with complete code, input and environment records, the Reproducibility check restores the environment in an isolated workspace, reruns the captured computation and compares the generated files. This is an optional check, distinct from Reviewer checks; neither is a required step in every study.</p><p>The animation uses real, uncropped window screenshots captured locally in Open-Science v0.30.2 on September 17, 2026: home, artifact, producing code and reproducibility verification. artifact-verification-demo-r.csv is explicitly labeled synthetic data (S1=10, S2=20, S3=30). It demonstrates deterministic computation and file comparison, not a scientific finding or customer outcome. This version was produced in an existing R environment; the actual isolated rerun returned Result reproduced, with all selected outputs matching the captured result. These are sequential screenshots, not a continuous screen recording.</p><p>A check covers the captured artifact version, not a full-session replay or the scientific validity of a conclusion. Historical artifacts with incomplete evidence may be unavailable for verification.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.30.2\" target=\"_blank\" rel=\"noopener\">Open-Science v0.30.2: per-version verification and current limitations</a>; local product screenshots and the synthetic CSV Notebook, artifact version and Reproducibility test, September 17, 2026.</div></aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"One workbench. A shared space for open research.\">\n <div class=\"kicker\">04 / THE OPEN RESEARCH COMMONS</div>\n <h2 class=\"section-title\">One workbench.<br>A <span class=\"highlight-text\">shared space for open research</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">Open-Science gives researchers across disciplines<br>a common place to work.</p><div class=\"commons-share\"><h3>What the community shares goes beyond code.</h3><p>Methods · Capability packages · Workflows<br>Validation records · Research practice</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">4K+</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub interest · Snapshot 2026.09</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Four groups collaborating in the Open-Science shared research space\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"A circular shared research workspace with four groups: a researcher analyzing data, domain experts discussing methods, a developer orchestrating a workflow, and an institutional research team working with laboratory equipment.\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"Explore how four community roles contribute\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"Researcher contribution path\">Researchers</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"Domain expert contribution path\">Domain experts</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"Developer contribution path\">Developers</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"Research institution contribution path\">Institutions</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">Choose a role to see how each group contributes.</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">CONTRIBUTION LOOP</span><span>Use</span><span class=\"cycle-arrow\">↔</span><span>Ask</span><span class=\"cycle-arrow\">↔</span><span>Review</span><span class=\"cycle-arrow\">↔</span><span>Share</span><span class=\"cycle-arrow\">↔</span><span>Improve</span></p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science is the common ground for a global, open research community.</p><p>Researchers can use capabilities contributed by others and bring back real research questions. Domain experts can turn methods, rules and experience into Specialists or Skills. Developers can connect tools, data sources and workflow components. Laboratories and research institutions can take part in validation, reproduction and collaborative studies.</p><p>The community can share code, methods, capability packages, workflows, validation records and research practice. Contributors remain in control of what they make public.</p><p>The contribution loop is: use capabilities, surface questions, inspect methods, share experience and improve together. Selecting a role reveals how each group contributes. The illustration is conceptual. The 4K+ GitHub Stars figure is a September 2026 snapshot of project interest, not a user count, contributor count or global ranking.</p><div class=\"sources\">[Sources]<br>Community roles, shared resources and contribution loop specified by AIPOCH. Concept illustration adapted from the shared research-workspace artwork. GitHub interest: September 2026 snapshot.<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub repository</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"One research question. Six connected systems.\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">One research question.<br><span class=\"highlight-text\">Six connected systems.</span></h2>\n <p class=\"subtitle\">Follow a paper-reproduction task from project setup to a result you can inspect.</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">EXAMPLE TASK</span><p>I have the paper and the data. I want to reproduce the main result.</p><span class=\"journey-hint\">Choose a step to follow the workflow →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"Six product systems across a researcher journey\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"Step 1: Set up the project\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">Set up the project</span><span class=\"journey-capability\">Persistent context</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"Step 2: Load specialist capabilities\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">Load expertise</span><span class=\"journey-capability\">Specialists & Skills</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"Step 3: Choose models and runtime\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">Choose your stack</span><span class=\"journey-capability\">Model · Agent<br>Slurm / SSH · Runtime</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"Step 4: Approve the plan\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">Approve the plan</span><span class=\"journey-capability\">Orchestration &amp; permissions</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"Step 5: Inspect outputs and annotate only if needed\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">Inspect outputs</span><span class=\"journey-capability\">Artifact · Optional revision</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"Step 6: Optionally check reproducibility for captured artifact versions\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">Reproducibility</span><span class=\"journey-capability\">Rerun &amp; compare a version</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">Define the target before you begin.</h3><p class=\"journey-detail-copy\">Create a project, specify the result to reproduce, and add the paper and data. Every session that follows can use the same context.</p><p class=\"journey-result\"><span>OUTPUT</span>A project anchored in the question and source material</p><button class=\"journey-next\" data-journey-to=\"1\">Next: load specialist capabilities →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/d13cf784f5a9e6bd.png\" alt=\"Open-Science project creation interface\" style=\"width:275.6435643564356%;left:-87.92079207920793%;top:-168.1592039800995%;height:auto\"></figure></div><figcaption>Create a project · Set the goal and context · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">Bring the right expertise into the project.</h3><p class=\"journey-detail-copy\">Select a Specialist, load the Skills the task needs, and connect the right tools and data sources.</p><p class=\"journey-result\"><span>OUTPUT</span>A study-specific set of scientific capabilities</p><button class=\"journey-next\" data-journey-to=\"2\">Next: choose the model and runtime →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/860ec00c1fb345e1.png\" alt=\"Open-Science Skills interface for finding, adding and enabling capabilities\" style=\"width:222.63681592039802%;left:-74.50248756218906%;top:-99.22879177377892%;height:auto\"></figure></div><figcaption>Skills · Find and load on demand · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">Choose how and where the work runs.</h3><p class=\"journey-detail-copy\">Select a model and agent, configure Python or R, then connect an SSH host or Slurm cluster when the study needs more compute.</p><p class=\"journey-result\"><span>OUTPUT</span>A stack matched to the study</p><button class=\"journey-next\" data-journey-to=\"3\">Next: approve the plan →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/1c9871b2f41e1095.png\" alt=\"Open-Science model settings with provider and connection choices\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div><figcaption>Model · Choose what the research uses · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">Approve the plan before anything runs.</h3><p class=\"journey-detail-copy\">Review the plan and permissions. The main agent can then delegate work to sub-agents, call tools and run code while progress stays visible.</p><p class=\"journey-result\"><span>OUTPUT</span>Code, intermediate results and a complete run record</p><button class=\"journey-next\" data-journey-to=\"4\">Next: inspect the outputs →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science Session Plan with clarification, phased tasks and approval controls\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>Session Plan · Review before execution · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">Review the result. Revise only if needed.</h3><p class=\"journey-detail-copy\">Figures, text and notebooks are ready to inspect or deliver. If a change is needed, select content or mark an image location and send it to the Agent.</p><p class=\"journey-result\"><span>OUTPUT</span>Reviewable outputs with an optional revision path</p><button class=\"journey-next\" data-journey-to=\"5\">Next: check reproducibility →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0416666667\"><figure class=\"crop shot\" data-crop=\"artifactAnnotation|1120,590,980,480\" style=\"aspect-ratio:980/480\"><img src=\"/open-science/assets/80d177354028b914.jpg\" alt=\"Open-Science artifact preview with an optional image-point annotation for the Agent\" style=\"width:218.6734693877551%;left:-114.28571428571428%;top:-122.91666666666667%;height:auto\"></figure></div><figcaption>Artifacts · Annotate only when a change is needed · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">Check reproducibility</h3><p class=\"journey-detail-copy\">For captured versions, optionally rerun and compare outputs in isolation. Incomplete records may block verification.</p><p class=\"journey-result\"><span>OPTIONAL OUTPUT</span>A comparison result and any differences</p><button class=\"journey-next\" data-journey-to=\"3\">↶ Return to the plan if needed</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.783687943262411\"><figure class=\"crop shot\" data-crop=\"artifactVerification|1275,228,785,282\" style=\"aspect-ratio:785/282\"><img src=\"/open-science/assets/5502c775b50c690b.png\" alt=\"Actual Open-Science check of a captured artifact version: synthetic CSV returns Result reproduced, with selected outputs matching\" style=\"width:264.3312101910828%;left:-162.4203821656051%;top:-80.85106382978722%;height:auto\"></figure></div><figcaption>Reproducibility · Verified synthetic example · Click for the full screenshot</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Context, files and provenance stay with the project, so a discrepancy leads back to the step that produced it.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The six-step journey stays intact. Step 6 now focuses on reproducibility checks for captured artifact versions.</p><p>The researcher creates a project with the paper and data, loads the required Specialist and Skills, then chooses the model, agent, compute and runtime. Once the researcher describes the task, the main agent proposes a Plan. After approval, Sub-agents divide the work and call real tools. Researchers can inspect or deliver an output as-is. When a change is needed, they can select text or mark an image location and send that context to the Agent; a revision becomes another Artifact Version.</p><p>The six steps describe a possible journey, not a mandatory workflow. Step 5 is about inspecting outputs, with Annotation available as an optional revision path. Step 6 is optional too: for captured versions with complete computation and environment records, researchers can rerun the computation in an isolated workspace and compare outputs without overwriting the originals. Incomplete records may prevent a check. This differs from Reviewer checks of methods and evidence. It does not promise full-session replay or validate a scientific conclusion. The final button only returns to planning; the researcher decides whether to revise or rerun.</p><p>The task is illustrative, not a customer quote or performance claim. Screenshots come from different demonstrations, not one continuous research run. Step 6 uses an actual local test in Open-Science v0.30.2 on September 17, 2026: the synthetic CSV (S1=10, S2=20, S3=30), produced in an existing R environment, returned Result reproduced after an isolated rerun. All selected outputs matched the captured result. This confirms reproducibility for that artifact version only. The slide focuses on the result card; clicking opens the original uncropped window screenshot.</p><p>The reproducibility description reflects v0.30.2. Some journey screenshots retain the v0.26.0 snapshot from September 7, 2026. Support across Desktop, Web, Mobile and CLI/Headless varies by environment. MedFlow remains SOON on the architecture slide.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 product interfaces and release materials; <a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">Annotations send selected artifact context to the Agent</a>; <a href=\"https://github.com/aipoch/open-science/releases/tag/v0.30.2\" target=\"_blank\" rel=\"noopener\">v0.30.2: artifact-version verification and current limitations</a>; actual local synthetic CSV verification test, September 17, 2026.<br>Product screenshots: Project, Skills, Model, Session Plan, Artifacts and Annotation.</div></aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"Research shouldn't start over when a conversation ends.\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">Research shouldn't start over when <span class=\"highlight-text\">a conversation ends</span></h2>\n <p class=\"subtitle\">Projects carry context, materials and decisions forward as the work evolves.</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"Persistent research workspace features\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>Persistent projects and sessions</b><small>Keep conversations, files and outputs together.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>Shared project context</b><small>Carry goals, definitions and constraints into each new session.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-memory\"><span class=\"num\">03</span><span><b>Durable research memory</b><small>Carry stable preferences forward; verify time-sensitive claims.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">04</span><span><b>Branch when the question changes</b><small>Explore a new path without losing the work behind it.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">05</span><span><b>Global search &amp; session references</b><small>Search: ⌘K / Ctrl+K · Reference a session: #</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">06</span><span><b>Side chat: independent parallel tabs</b><small>Run multiple tabs alongside the main session.</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.7777777777777777\"><figure class=\"crop\" data-crop=\"workspaceProject|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/b222df7f22573047.jpg\" alt=\"Open-Science project workspace with multiple sessions, files and outputs\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project workspace · Build research across sessions</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:.7689822294022617\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceContext|0,0,476,619\" style=\"aspect-ratio:476/619\"><img src=\"/open-science/assets/bd4267932c391f0f.jpg\" alt=\"Open-Science Project Settings with Agent Context\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project Agent Context · Carry shared goals into every session</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-memory\" style=\"--workspace-shot-ratio:1.3982808022922637\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"memory|0,0,976,698\" style=\"aspect-ratio:976/698\"><img src=\"/open-science/assets/4f45037e594fef5f.png\" alt=\"Open-Science Memory settings for durable research preferences and background\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Research Profile · Carry stable preferences into future work</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.8333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceBranch|600,800,1100,600\" style=\"aspect-ratio:1100/600\"><img src=\"/open-science/assets/4bb8c2a8d10c2112.jpg\" alt=\"Open-Science action for branching research into a new session\" style=\"width:181.72727272727275%;left:-54.54545454545454%;top:-133.33333333333331%;height:auto\"></figure><figcaption>Branch in new session · Explore another path from existing work</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.743276283618582\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"globalSearch|380,125,1426,818\" style=\"aspect-ratio:1426/818\"><img src=\"/open-science/assets/8ae9d8a04ae2ff3b.png\" alt=\"Open-Science global search across messages, sessions, projects, uploaded files, generated files and the Library\" style=\"width:153.36605890603084%;left:-26.64796633941094%;top:-15.28117359413203%;height:auto\"></figure><figcaption>Global Search · ⌘K / Ctrl+K · Click for full screenshot</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.2857142857142858\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceSidechat|620,685,900,700\" style=\"aspect-ratio:900/700\"><img src=\"/open-science/assets/34b8bac0510d9049.png\" alt=\"Open-Science Side chat entry point shown in an earlier interface\" style=\"width:191.66666666666669%;left:-68.88888888888889%;top:-97.85714285714285%;height:auto\"></figure><figcaption>Side chat · Side conversation entry point (earlier interface)</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Start a new session without starting the research over.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Research context belongs to the project, not to a single conversation.</p><p>Six workspace features support ongoing research: projects retain sessions and outputs; Project Agent Context carries shared goals and constraints; Research Profile stores stable preferences and background; researchers can branch and find earlier work through global search. Side chat is more than a way to guide the main conversation: multiple independent tabs can run alongside the main session, each handling a separate question.</p><p>Open Search from the home screen, or press ⌘K on Mac / Ctrl+K. The search panel covers messages, sessions, projects, uploaded files, generated files and the Library. Uploaded files are searchable by name and indexed content; generated files are searchable by name only. Unindexed content is not searched. Use # to reference a previous session in the current conversation; @ is for file references.</p><p>Memory is for stable preferences and context, not an exemption from verifying time-sensitive facts. Continuing research means restoring persistent records and context; it does not promise that every interrupted external compute job resumes automatically. The Side chat image shows an earlier entry point, not multiple tabs running simultaneously. Independent chats are not presented as instructions that automatically merge into the main session.</p><div class=\"sources\">[Sources]<br>Global search: local Open-Science v0.30.2 interface and Search shortcut tooltip, captured 2026.09.17.<br>Independent Side chat tabs running alongside the main session: product capability confirmed by AIPOCH for this update.<br>Other views retain the Open-Science v0.26.0 demonstration screenshots supplied by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-surface literature\" data-page=\"08\" data-title=\"From literature discovery to evidence you can question and cite\">\n <div class=\"kicker\">07 / LITERATURE REFERENCE LIBRARY</div>\n <h2 class=\"section-title\">From literature discovery to<br><span class=\"highlight-text\">evidence you can question and cite</span></h2>\n <p class=\"subtitle\">Import PDFs in bulk, extract figures and tables, and ask the Agent about passages or extracted visuals.</p>\n <div class=\"content literature-interactive gallery\" data-gallery=\"literature\">\n  <div class=\"literature-tabs\" role=\"tablist\" aria-label=\"Literature Reference Library features\">\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"literature-library\"><span class=\"literature-num\">01</span><span><b>Import &amp; manage</b><small>Bulk PDF import and cross-project search</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-reference\"><span class=\"literature-num\">02</span><span><b>Record</b><small>Metadata and project links</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-fulltext\"><span class=\"literature-num\">03</span><span><b>Ask about a passage</b><small>Select a sentence and ask in context</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-figures\"><span class=\"literature-num\">04</span><span><b>Extract figures &amp; tables</b><small>Export tables and read with the Agent</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-citation\"><span class=\"literature-num\">05</span><span><b>Citations</b><small>Copy and export</small></span></button>\n  </div>\n  <div class=\"literature-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"literature-library\"><figure class=\"crop\" data-crop=\"literatureLibrary|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/cdc78c7a9691f76c.png\" alt=\"Open-Science Literature Library for searching, filtering, rating and deduplicating references\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>LIBRARY · Search, filter, rate and deduplicate across projects</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-reference\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureReference|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/e98f87a6d3b03588.png\" alt=\"Open-Science reference record with DOI, authors, tags, attachments and project links\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>RECORD · DOI, authors, tags, attachments and project links</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-fulltext\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFullText|300,0,2260,1271\" style=\"aspect-ratio:2260/1271\"><img src=\"/open-science/assets/99c9442a1357e738.jpg\" alt=\"Open-Science highlighting a passage in a PDF and asking the Agent within the same research session\" style=\"width:113.27433628318585%;left:-13.274336283185843%;top:0%;height:auto\"></figure><figcaption>READ &amp; ASK · Highlight a passage and ask the Agent in context</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-figures\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFigures|160,134,1868,838\" style=\"aspect-ratio:1868/838\"><img src=\"/open-science/assets/8dc14eb748c6f2e8.png\" alt=\"Open-Science Figures and tables view with extracted content and the Read with agent entry point\" style=\"width:117.07708779443256%;left:-8.565310492505352%;top:-15.990453460620524%;height:auto\"></figure><figcaption>FIGURES &amp; TABLES · Extract structure, export tables and read with the Agent</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-citation\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureCitation|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/6e81dbe2ab53bdd6.png\" alt=\"Open-Science citation panel with formatted citations and BibTeX or RIS export\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>CITATIONS · Copy common styles or export BibTeX / RIS</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Use the text and extracted visuals together, then check the Agent's answer against the paper.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The Library supports bulk PDF import and helps researchers work with the figures and tables inside their papers.</p><p>The five features cover importing and managing papers, reference records, passage questions, figure and table extraction, and citations. Import multiple PDFs at once, then search, filter, rate and deduplicate them while retaining DOI, authors, tags, attachments and project links. Researchers can select a sentence in the full text and ask the Agent within the paper's context, copy formatted citations, or export BibTeX and RIS.</p><p>Figure and table extraction makes structured content available for further work. Researchers can export tables and ask the Agent to read the extracted visuals. This concerns source literature, separately from Annotation for revising generated artifacts. Extraction, export and questions are optional capabilities, not mandatory steps for every paper.</p><p>Check extracted content and the Agent's answer against the original paper. Extraction does not guarantee complete or accurate results for every figure or table. The current extraction entry point says scanned and rotated pages are not yet supported. Full-text access depends on the source, licensing and network conditions.</p><div class=\"sources\">[Sources]<br>Local Open-Science v0.30.2 Figures and tables interface, 2026.09.17. Demonstration paper: Breaking the scaling relationship via thermally stable Pt/Cu single atom alloys for catalytic dehydrogenation (Nature Communications, 2018).<br>AIPOCH product capability information, 2026.09.17: bulk PDF import, structured figure and table extraction, table export, and Agent access to extracted visuals.<br>Library, record and citation views retain Open-Science v0.26.0 screenshots supplied on 2026-09-07. Reading and passage question view supplied on 2026-09-08.</div></aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"09\" data-title=\"Build the stack around the research\">\n <div class=\"kicker\">08 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">Build the stack <span class=\"highlight-text\">around the research</span></h2>\n <p class=\"subtitle\">Choose the right tools for each task—and switch them as the work evolves.</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Pick the agent</h3><p>Four frameworks: Claude Agent, OpenCode, Codex and CodeBuddy.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>Choose the model</h3><p>Connect model providers, compatible gateways or subscription accounts. Switch models within a task.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>Bring your own compute</h3><p>Run locally, over SSH or on a Slurm cluster.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>Set the runtime</h3><p>Python, R and REPL kernels with repair and network protection.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>Connect your data</h3><p>Project files, 24 research Connectors, 200+ tools and custom MCP.</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Technology choices\"><button role=\"tab\" aria-selected=\"true\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackAgent|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/0e88d4e9cdaa2c78.png\" alt=\"Open-Science v0.30.2 agent settings with Claude Agent, OpenCode, Codex and CodeBuddy\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackModel|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/c76062e747bd867c.png\" alt=\"Open-Science v0.30.2 model settings with subscription logins and multiple API providers\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackCompute|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/74f4c2e211ba13fc.png\" alt=\"Open-Science v0.30.2 Compute form for an SSH host with Slurm HPC execution\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackRuntime|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/7c59bc409d7a5391.png\" alt=\"Open-Science v0.30.2 Runtimes with managed and custom Python and R environments and package controls\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"stackConnectors|518,122,1152,824\" style=\"aspect-ratio:1152/824\"><img src=\"/open-science/assets/bba1f6978cd1fdae.png\" alt=\"Open-Science v0.30.2 Connectors with 24 installed research connectors, filters and bulk management\" style=\"width:189.84375%;left:-44.96527777777778%;top:-14.805825242718445%;height:auto\"></figure></div>\n </div><div class=\"shot-caption\"><span>BUILD YOUR STACK</span><span>SELECT A TAB TO VIEW THE PRODUCT</span></div><p class=\"small-note\">If you use third-party models, remote services or connectors, their data policies and pricing apply.</p></div></div>\n <p class=\"summary\">The stack can change. The research goal and every major choice stay with the researcher.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Choose the agent, model, compute, runtime and data connections to fit the study, with room to change the stack as the work evolves.</p><p>The v0.30.2 settings center groups these choices and includes settings-wide search. The four agent frameworks remain Claude Agent, OpenCode, Codex and CodeBuddy. Model connections cover multiple cloud providers, compatible Custom Gateways and subscription logins rather than a fixed provider count. Subscription options and model availability depend on the selected agent, API protocol and account configuration.</p><p>All five images show the local v0.30.2 light settings interface. Model shows an unsaved provider selection form. Agent shows three installed frameworks and the CodeBuddy installation entry. Runtime shows Python and R environments with package controls. Compute shows an unsaved Slurm host form, not a connected HPC cluster. Slurm jobs go through an SSH login node, while ordinary command calls still run on that node.</p><p>Data shows 24 installed research Connectors. The official README still lists 24 built-in research connectors. The 200+ tools figure describes the scale of the official connector code catalog: snapshot f0c0e081 contains 235 distinct literal tool definitions in the registry and its imported descriptor files. It does not mean every tool is enabled for every task or that every connection has been tested. Availability depends on version, enabled connectors, permissions and service configuration. Researchers can also add local commands, remote MCP services or imported connector configurations.</p><p>Cloud models, remote endpoints and third-party connectors may send requests to those services. Local-first does not guarantee that data stays on-device under every configuration. The chosen services determine pricing and data policies.</p><div class=\"sources\">[Sources]<br>Local Open-Science v0.30.2 Model, Agent, Runtimes, Compute and Connectors settings interfaces, September 17, 2026.<br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#model-providers\" target=\"_blank\" rel=\"noopener\">Official README: model connection options, four agent frameworks and 24 built-in Connectors, accessed September 17, 2026</a><br><a href=\"https://github.com/aipoch/open-science/blob/f0c0e08125c2c2acc091e5c7ae10e3e8c88a5341/src/main/connectors/registry.ts\" target=\"_blank\" rel=\"noopener\">Official connector registry and imported descriptor files supporting the 200+ tools figure</a></div></aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"10\" data-title=\"Load the expertise your research needs\">\n <div class=\"kicker\">09 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">Load the expertise <span class=\"highlight-text\">your research needs</span></h2>\n <p class=\"subtitle\">Specialists provide domain context. Skills package methods that can be called, combined and shared.</p>\n <div class=\"content\"><div class=\"gallery marketplace-gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Skills and Specialist Marketplace features\"><button role=\"tab\" aria-selected=\"true\" data-select=\"discover\">Discover</button><button role=\"tab\" aria-selected=\"false\" data-select=\"install\">Install</button><button role=\"tab\" aria-selected=\"false\" data-select=\"batch\">Bulk install</button><button role=\"tab\" aria-selected=\"false\" data-select=\"updates\">Updates</button><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"false\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"discover\" role=\"tabpanel\" style=\"--market-shot-ratio:2.85714\"><figure class=\"crop\" data-crop=\"marketplaceDiscover|216,90,1400,490\" style=\"aspect-ratio:1400/490\"><img src=\"/open-science/assets/5af5576dbc1d742f.jpg\" alt=\"Open-Science v0.30.2 Skills Marketplace with search, category and installation filters, and individual installation controls\" style=\"width:118.57142857142857%;left:-15.428571428571427%;top:-18.367346938775512%;height:auto\"></figure><p class=\"marketplace-caption\">Search and filter for the Skill your task needs. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"install\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceInstall|506,96,840,390\" style=\"aspect-ratio:840/390\"><img src=\"/open-science/assets/493df4ad7b92989f.jpg\" alt=\"Open-Science v0.30.2 Skill details with author, version, license, source information and an Install button\" style=\"width:197.61904761904762%;left:-60.238095238095234%;top:-24.615384615384617%;height:auto\"></figure><p class=\"marketplace-caption\">Check the version and source before installing. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"batch\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceBatch|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/1de5699314b5f499.jpg\" alt=\"Open-Science v0.30.2 bulk management with two Skills selected and the installation control visible, without installing\" style=\"width:118.57142857142857%;left:-15.428571428571427%;top:-13.846153846153847%;height:auto\"></figure><p class=\"marketplace-caption\">Select several Skills and confirm installation together. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"updates\" role=\"tabpanel\" style=\"--market-shot-ratio:2.15385\"><figure class=\"crop\" data-crop=\"marketplaceUpdates|216,90,1400,650\" style=\"aspect-ratio:1400/650\"><img src=\"/open-science/assets/06cbb5acf977cd78.jpg\" alt=\"Open-Science v0.30.2 Updates list showing no pending Skill updates for the current account\" style=\"width:118.57142857142857%;left:-15.428571428571427%;top:-13.846153846153847%;height:auto\"></figure><p class=\"marketplace-caption\">Review and confirm updates. None pending in this view. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\" style=\"--market-shot-ratio:1.90698\"><figure class=\"crop specialist-shot\" data-crop=\"marketplaceSpecialists|506,98,820,430\" style=\"aspect-ratio:820/430\"><img src=\"/open-science/assets/2fc5dd06dadd3d08.jpg\" alt=\"Open-Science v0.30.2 Specialist Marketplace with multidisciplinary packages, versions, publishers and installation status in the full image\" style=\"width:202.4390243902439%;left:-61.70731707317073%;top:-22.790697674418606%;height:auto\"></figure><p class=\"marketplace-caption\">Browse Specialists for a defined research task. Click to enlarge.</p></div>\n <div class=\"gallery-panel\" data-panel=\"skills\" role=\"tabpanel\" style=\"--market-shot-ratio:1.71429\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/a5240cb3645ee9d5.png\" alt=\"Open-Science Skills interface for browsing, enabling, uploading, importing and creating Skills\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-26.785714285714285%;height:auto\"></figure><p class=\"marketplace-caption\">Load, create or import your own Skill. Click to enlarge.</p></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>Across disciplines:</b> Specialists and Skills span life science, medicine, chemistry, physics, astronomy, environmental science, engineering and data science.</span></p><p><span>02</span><span class=\"skill-copy\"><b>Yours to load, adapt and share:</b> create a Skill in natural language, upload a package or import from GitHub. Marketplace contributions go live after review.</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN SKILL MARKETPLACE · USE, BUILD, CONTRIBUTE</span></div><p class=\"resource-snapshot\">GitHub Stars snapshot · 2026.09.17</p>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense mark\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">45.3K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · Research and analysis across disciplines</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic mark\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">176.8K ★ ↗</span></div><p class=\"source-desc\">Anthropic Agent Skills · Document, design and developer workflows</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind mark\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">3.1K ★ ↗</span></div><p class=\"source-desc\">Science Skills · Genomics, structural biology and scientific search</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-logo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills project mark\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">42.8K ★ ↗</span></div><p class=\"source-desc\">Scientific discovery, writing, visualization and peer review</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA mark\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">461 ★ ↗</span></div><p class=\"source-desc\">BioNeMo Agent Toolkit · Protein, molecule and genomics workflows</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>PUBLISH YOUR SKILL</b><p>Submit it for review so others can inspect, load, test and improve it through the Marketplace.</p></div></div>\n </div>\n </div>\n <p class=\"summary\">Find, install and update capabilities as needed, and contribute your own methods to the community.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Researchers can be both users and contributors of open scientific capability.</p><p>A Specialist packages a defined professional scope and may include dedicated Skills and Connectors. A Skill can run and combine independently. Researchers choose what a task needs. Installing, updating and publishing are optional.</p><p>Skills Marketplace supports search, category and installation filters. Details show the author, version, license and source before individual installation. Batch manage supports selecting several Skills for installation, while Updates lists pending versions for confirmation. Specialist Marketplace shows multidisciplinary packages and installation status. The current local account has no pending Skill updates, so the Updates view is empty. Scores shown in the market are upstream self-assessments, not independent validation.</p><p>The original Skill loading, creation through conversation, package uploads and GitHub imports remain available, alongside open marketplace contributions. Local imports do not publish capabilities. Skills and Specialist Marketplace contributions go live after review. Check third-party licenses, dependencies and configuration before use, and inspect the research output.</p><p>The eight-plus domains summarize representative Specialists and open Skill collections rather than a fixed taxonomy. GitHub API snapshot, 2026.09.17 12:26 UTC: K-Dense 45,334; Anthropic Skills 176,803; Google DeepMind Science Skills 3,067; Nature Skills 42,771; NVIDIA BioNeMo Agent Toolkit 461. Figures in thousands round to one decimal. These counts represent interest in the external repositories, not Open-Science users, installations or endorsements.</p><div class=\"sources\">[Sources]<br>Local Open-Science v0.30.2 white Skills Marketplace, Skill detail, Batch manage, Updates and Specialist Marketplace interfaces, 2026.09.17. Original Skills view supplied by AIPOCH.<br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#core-capabilities\" target=\"_blank\" rel=\"noopener\">Official README: installation, updates, creation, imports and reviewed publication, accessed 2026.09.17</a><br><a href=\"https://github.com/aipoch/openscience-skill-marketplace\" target=\"_blank\" rel=\"noopener\">Skills Marketplace</a><br><a href=\"https://github.com/aipoch/openscience-specialist-marketplace\" target=\"_blank\" rel=\"noopener\">Specialist Marketplace</a><br>Stars: stargazers_count in GitHub API /repos/{owner}/{repo}, snapshot 2026.09.17 for the following projects.<br><a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense Scientific Agent Skills</a><br><a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a><br><a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a><br><a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a><br><a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"11\" data-title=\"Put scientific capabilities to work\">\n <div class=\"kicker\">10 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">Put scientific capabilities <span class=\"highlight-text\">to work</span></h2>\n <p class=\"subtitle\">Enable Delegation or Reviewer when the task calls for it. Long jobs can run in the background and return results automatically.</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"Four research execution capabilities\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>Define the task</b><small>Review a plan when one is needed</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>Delegate when needed</b><small>Enable Delegation for suitable tasks</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>Tools and background jobs</b><small>Completed jobs return results automatically</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>Enable Reviewer as needed</b><small>Check the turn's records and evidence</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK &amp; PLANNING</strong><span>Review and approve a plan when the task needs one</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"journeyPlan|850,0,878,650\" style=\"aspect-ratio:878/650\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science Session Plan example with goals, steps and deliverables for researcher approval\" style=\"width:196.8109339407745%;left:-96.81093394077449%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SESSION PLAN EXAMPLE</span><span>Goals · Steps · Boundaries · Deliverables</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / OPTIONAL DELEGATION</strong><span>Enable session-level Delegation when needed</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"subagents|75,250,900,340\" style=\"aspect-ratio:900/340\"><img src=\"/open-science/assets/6dac6a590e97efcb.png\" alt=\"Open-Science Delegation example showing five sub-agents and their completion status\" style=\"width:115.44444444444444%;left:-8.333333333333332%;top:-73.52941176470588%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>DELEGATION EXAMPLE: 5 SUB-AGENTS</span><span>Task · Specialist role · Status</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / TOOLS &amp; BACKGROUND EXECUTION</strong><span>Notebook, REPL and shell jobs support background execution</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"live|520,720,1100,520\" style=\"aspect-ratio:1100/520\"><img src=\"/open-science/assets/b1110a6a25a8964a.png\" alt=\"Open-Science tool execution example showing Notebook, tool calls and run status\" style=\"width:232.72727272727272%;left:-47.27272727272727%;top:-138.46153846153845%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SKILL · CONNECTOR · PYTHON / R · REMOTE COMPUTE</span><span>Background jobs return results on completion</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / OPTIONAL REVIEWER</strong><span>Optional checks support the researcher's judgment</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"reviewer|1460,0,1100,720\" style=\"aspect-ratio:1100/720\"><img src=\"/open-science/assets/2ebc9a694ad40a1a.png\" alt=\"Open-Science Reviewer example checking a completed turn's responses, execution logs and related file evidence\" style=\"width:232.72727272727272%;left:-132.72727272727275%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>RESPONSES · EXECUTION LOGS · FILE EVIDENCE</span><span>Limited to the turn's available records</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">You steer the research. The agent runs real tools, with Delegation and Reviewer checks available when needed.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science runs real scientific tools. Long jobs can continue in the background and return results automatically, while researchers enable Delegation and Reviewer according to the task.</p><p>The four tabs show execution capabilities that researchers can use independently. Their numbering organizes the demonstration without requiring every task to follow all four views. When structured planning helps, the agent can propose a Session Plan for the researcher to review, including goals, steps, boundaries and deliverables.</p><p>With session-level Delegation enabled, the main agent can assign suitable tasks to sub-agents, such as literature collection or evidence mapping. The main agent can also execute directly through Skills, Connectors, Python/R and compute environments. Tool Summary Cards expose tool activity and status.</p><p>Long Notebook, REPL and shell jobs support background execution, releasing the agent turn while preserving run identity, cancellation and provenance. Completed results return automatically for local runs and remote compute jobs. Background execution works independently of Delegation. The retained screenshot illustrates tool calls and status rather than a continuous background job and its completion delivery.</p><p>Researchers can enable optional auto-review in a separate context to check a completed agent turn's responses, execution logs and related file evidence. Findings can trigger a bounded correction and re-review cycle. Reviewer covers only the records available for that turn and cannot guarantee scientific validity. Artifact-version reproducibility checks separately rerun captured computation and compare outputs. Researchers can deliver an artifact as-is or request a revision when needed.</p><p>The four screenshots remain real interfaces from earlier, separate demonstrations. They do not depict one continuous run. Capability descriptions reflect official materials accessed on September 17, 2026.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.27.0\" target=\"_blank\" rel=\"noopener\">v0.27.0: background execution and automatic result delivery</a><br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#core-capabilities\" target=\"_blank\" rel=\"noopener\">Official capabilities: Specialists, Delegation, optional Reviewer and background execution</a> (accessed September 17, 2026)<br>Session Plan, Sub-agents, tool execution and Session Reviewer screenshots supplied by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"12\" data-title=\"Keep every file together. Trace every result back.\">\n <div class=\"kicker\">11 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">Keep every file together.<br><span class=\"highlight-text\">Trace every result back.</span></h2>\n <p class=\"subtitle\">Keep files, artifact versions and run records linked—and hand them over in a .science research package.</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"Five capabilities for materials, versions, provenance, control and research handoff\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS</b><small>Project files, attachments up to 10 GiB each, and @ / # references.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS &amp; VERSIONS</b><small>Edit text, save a new version and compare. Image annotations are optional.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE</b><small>Link the Execution Log to inputs, code and environment.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL</b><small>Set network boundaries for Notebooks and Connectors by domain.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-handoff\"><span class=\"evidence-num\">05</span><span><b>RESEARCH HANDOFF</b><small>Export a .science package with history, selected versions and captured evidence.</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / REFERENCES &amp; FILES</strong><span>Add, organize and reference source material</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceMaterials|0,500,2113,780\" style=\"aspect-ratio:2113/780\"><img src=\"/open-science/assets/840a5021386b1c69.jpg\" alt=\"Open-Science Files with uploaded materials, generated files and in-session file references\" style=\"width:100%;left:0%;top:-64.1025641025641%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / EDIT · SAVE A NEW VERSION · COMPARE</strong><span>Revise only if needed. Keep the original version.</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"textCompare|84,63,1494,382\" style=\"aspect-ratio:1494/382\"><img src=\"/open-science/assets/88add6d46148e7b3.jpg\" alt=\"Open-Science light-mode version comparison: a synthetic Markdown demo saved as v2, with the added handoff note highlighted against v1\" style=\"width:111.11111111111111%;left:-5.622489959839357%;top:-16.49214659685864%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>TEXT VERSION · v1 → v2 · SYNTHETIC DEMO</span><div class=\"evidence-example-links\"><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/26d4c8736f466d3e.jpg\" alt=\"Open-Science source editor with editable Markdown and Save to publish a new version; synthetic demo\"><figcaption>See the text editor ↗</figcaption></figure><figure class=\"crop shot evidence-example-link\"><img src=\"/open-science/assets/80d177354028b914.jpg\" alt=\"Open-Science image artifact with an optional point annotation for sending revision context to the Agent\"><figcaption>Optional image annotation ↗</figcaption></figure></div></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>Trace an artifact back to code, tool calls and environment</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceProvenance|1480,0,1080,720\" style=\"aspect-ratio:1080/720\"><img src=\"/open-science/assets/acda349e68bde787.png\" alt=\"Open-Science artifact Execution Log retaining code, tool calls, inputs and output\" style=\"width:237.037037037037%;left:-137.03703703703704%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>The run record persists</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>Define network boundaries for Notebooks and Connectors</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceControl|580,250,1400,950\" style=\"aspect-ratio:1400/950\"><img src=\"/open-science/assets/dd683e15331a1936.png\" alt=\"Open-Science Network settings for domain-based Notebook and Connector access\" style=\"width:182.85714285714286%;left:-41.42857142857143%;top:-26.31578947368421%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · CONNECTORS · DOMAIN RULES</span><span>Controlled access · Network protection</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-handoff\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>05 / .science RESEARCH PACKAGE</strong><span>Choose what to include, then hand over the record.</span></div><div class=\"execution-panel-body handoff-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"researchPackage|560,127,541,540\" style=\"aspect-ratio:541/540\"><img src=\"/open-science/assets/fe6e62708aaf927b.jpg\" alt=\"Open-Science light-mode Export Session package dialog with Essential, Full and custom contents options; synthetic artifact-verification demo session\" style=\"width:306.8391866913124%;left:-103.51201478743069%;top:-23.51851851851852%;height:auto\"></figure><div class=\"handoff-detail\"><h3>.science</h3><p><b>History and file versions</b>Conversation branches and selected artifact or upload versions.</p><p><b>Run records and captured evidence</b>Available Notebook records, verification receipts and environment locks.</p><p class=\"handoff-boundary\">Imports are read-only. No automatic code execution or credential restore. Check the data before sharing.</p></div></div><div class=\"execution-panel-caption\"><span>ESSENTIAL · FULL · CUSTOMIZE CONTENTS</span><span>Read-only import · No auto-execution</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Deliver results as-is, revise when needed, and hand over a package with inspectable versions and records.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The five tabs cover materials, editable artifacts and versions, provenance, control and research handoff. These capabilities can be used independently; their numbering does not prescribe a required sequence.</p><p>02: Supported text artifacts and uploads—including Markdown, plain text and scripts—can be edited directly. Saving publishes a new managed version, preserves the original and enables comparison. Delivering the result unchanged is equally valid. Image-point annotation is a separate, optional way to send revision context to the Agent, not direct pixel editing or a prerequisite for saving text. The two links below the comparison open the full editor and annotation screenshots.</p><p>03 links an artifact to available inputs, code, tool calls and environment records. 04 controls domain-based Notebook and Connector access. The attachment limit is 10 GiB per file; model context limits remain separate.</p><p>05: Export .science with conversation branches, chosen artifact/upload versions and available Notebook and verification records. Essential, Full and custom selections determine which files travel with it. Imports require preview and confirmation and remain read-only; they do not execute code, restore credentials or guarantee a working runtime on the receiving computer. Source verification receipts are records, not a fresh check on the destination. Side chats and bookmarks are currently excluded. Review private data before sharing.</p><p>The editor and comparison screenshots were captured locally in v0.30.2 on September 17, 2026. An uploaded synthetic Markdown file was manually edited and saved as v2; the original remained available, and Compare showed the added handoff note. This is not an agent-generated result or scientific finding. The package screenshot shows export options for a local synthetic verification demo, not a completed cross-machine import or replay.</p><div class=\"sources\">[Sources]<br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.25.0\" target=\"_blank\" rel=\"noopener\">v0.25.0: source editing, new versions and Compare</a><br><a href=\"https://github.com/aipoch/open-science/releases/tag/v0.29.0\" target=\"_blank\" rel=\"noopener\">v0.29.0: .science packages, export selection and read-only imports</a><br><a href=\"https://github.com/aipoch/open-science/blob/main/README.md#core-capabilities\" target=\"_blank\" rel=\"noopener\">Official capabilities: file limits, artifact provenance and package boundaries</a> (accessed September 17, 2026)<br><a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">PR #1815: optional Annotation</a><br>Local light-mode editor, v2 comparison and package export screenshots (September 17, 2026); retained Files, Annotation, Execution Log and Network screenshots supplied earlier.</div></aside>\n</section>\n\n<section class=\"slide architecture\" data-page=\"13\" data-title=\"AIPOCH is building the infrastructure for open research\">\n <div class=\"kicker\">12 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH is building the infrastructure <span class=\"highlight-text\">for open research</span></h2>\n <p class=\"subtitle\">Open-Science is the public workbench, supported by specialist capabilities, execution engines and technical services.</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH product architecture represented as a building with services, capabilities, execution and an open research space\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>The open workbench and community entry point<span class=\"benchmark-result\"><b>#1</b>OPEN-SCIENCE · BIOMNIBENCH-DA PUBLIC 50</span></p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">SOON</span></h3><p>Coming soon: resumable research workflows built from specialist capabilities</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>MedSkillAudit: Skill audits and ratings · public benchmarks and leaderboards</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Model · Agent · Compute</h3><p>Runtime, environment and data services</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>GLOBAL OPEN RESEARCH COMMUNITY</strong>　Contribute · Review · Collaborate · Reuse</div></div>\n <p class=\"summary\">AIPOCH turns models, tools and research expertise into capabilities the global community can use and improve.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The architecture is shown from the AIPOCH company perspective: Open-Science is the open entry point, supported by execution, capability and technical layers.</p><p>The upper space is Open-Science, containing projects, sessions, context, files and research outputs. MedFlow is marked SOON and is intended to organize validated capabilities into executable, recoverable workflows. The capability layer contains Specialists, Skills and Connectors. MedSkillAudit is live for Skill audits and ratings, with public entry points for Benchmark and Leaderboard work. Open-Science ranks first on BiomniBench-DA Public 50. The foundation provides models, agents, compute, environments and data services.</p><p>This is a conceptual product architecture, not a deployment topology. The space around the building represents the global open research community contributing, validating, collaborating and reusing capabilities.</p><div class=\"sources\">[Sources]<br>AIPOCH 2026 mid-year architecture artwork; architecture framing and product status confirmed by AIPOCH; Open-Science v0.26.0 product materials; first-place BiomniBench-DA Public 50 result supplied by AIPOCH; <a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH website</a>.</div></aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"14\" data-title=\"A global community can take research further\">\n <div class=\"kicker\">13 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">A global community can take <span class=\"highlight-text\">research further</span></h2>\n <p class=\"subtitle\">Researchers, domain experts, developers and institutions contribute the methods and tools; AIPOCH supports the places and programs that bring them together.</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>Researchers</h3><p>Use community-built capabilities<br>and bring back real questions.</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>Domain experts</h3><p>Package methods and judgment<br>as Specialists or Skills.</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>Developers</h3><p>Connect tools, data sources<br>and workflow components.</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>Institutions</h3><p>Run validation, reproduction<br>and collaborative studies.</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH pixel sticker for community support\"><div><span>AIPOCH / COMMUNITY CONVENER</span><b>Bringing people and infrast
