e.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science is the working environment around the model: the project, tools, execution and research record.</p><p>It connects different AI models, scientific skills and real research workflows. Researchers can choose models, agents, compute and data connections, then inspect both source materials and execution outputs inside the same project.</p><p>The existing home animation remains in place, showing running work, project spaces and recent sessions. The rest of this edition was reviewed against v0.26.0.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 product materials; home animation supplied by AIPOCH; product definition supplied by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark commons\" data-page=\"05\" data-title=\"One workbench. A shared space for open research.\">\n <div class=\"kicker\">04 / THE OPEN RESEARCH COMMONS</div>\n <h2 class=\"section-title\">One workbench.<br>A <span class=\"highlight-text\">shared space for open research</span></h2>\n <div class=\"content\">\n  <div><p class=\"community-intro\">Open-Science gives researchers across disciplines<br>a common place to work.</p><div class=\"commons-share\"><h3>What the community shares goes beyond code.</h3><p>Methods · Capability packages · Workflows<br>Validation records · Research practice</p></div><a class=\"github-metric\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><span class=\"value\">4K+</span><span class=\"metric-label\">GITHUB STARS<br>aipoch/open-science</span></a><p class=\"fine\" style=\"margin-top:13px\">GitHub interest · Snapshot 2026.09</p></div>\n  <div class=\"commons-map\" data-community data-focus=\"\" aria-label=\"Four groups collaborating in the Open-Science shared research space\">\n   <div class=\"commons-space-head\">ONE SHARED RESEARCH SPACE</div>\n   <figure class=\"commons-art\"><div class=\"commons-art-stage\"><img class=\"commons-art-base\" src=\"/open-science/assets/779f062f1c72ba11.png\" alt=\"A circular shared research workspace with four groups: a researcher analyzing data, domain experts discussing methods, a developer orchestrating a workflow, and an institutional research team working with laboratory equipment.\"></div></figure>\n   <div class=\"commons-roles\" role=\"group\" aria-label=\"Explore how four community roles contribute\">\n    <button class=\"shared-role\" data-role=\"researcher\" aria-pressed=\"false\" aria-label=\"Researcher contribution path\">Researchers</button>\n    <button class=\"shared-role\" data-role=\"expert\" aria-pressed=\"false\" aria-label=\"Domain expert contribution path\">Domain experts</button>\n    <button class=\"shared-role\" data-role=\"developer\" aria-pressed=\"false\" aria-label=\"Developer contribution path\">Developers</button>\n    <button class=\"shared-role\" data-role=\"institution\" aria-pressed=\"false\" aria-label=\"Research institution contribution path\">Institutions</button>\n   </div>\n   <p class=\"commons-context\" id=\"commonsContext\" aria-live=\"polite\">Choose a role to see how each group contributes.</p>\n  </div>\n </div>\n <p class=\"summary commons-cycle\"><span class=\"cycle-label\">CONTRIBUTION LOOP</span><span>Use</span><span class=\"cycle-arrow\">↔</span><span>Ask</span><span class=\"cycle-arrow\">↔</span><span>Review</span><span class=\"cycle-arrow\">↔</span><span>Share</span><span class=\"cycle-arrow\">↔</span><span>Improve</span></p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open-Science is the common ground for a global, open research community.</p><p>Researchers can use capabilities contributed by others and bring back real research questions. Domain experts can turn methods, rules and experience into Specialists or Skills. Developers can connect tools, data sources and workflow components. Laboratories and research institutions can take part in validation, reproduction and collaborative studies.</p><p>The community can share code, methods, capability packages, workflows, validation records and research practice. Contributors remain in control of what they make public.</p><p>The contribution loop is: use capabilities, surface questions, inspect methods, share experience and improve together. Selecting a role reveals how each group contributes. The illustration is conceptual. The 4K+ GitHub Stars figure is a September 2026 snapshot of project interest, not a user count, contributor count or global ranking.</p><div class=\"sources\">[Sources]<br>Community roles, shared resources and contribution loop specified by AIPOCH. Concept illustration adapted from the shared research-workspace artwork. GitHub interest: September 2026 snapshot.<br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science GitHub repository</a></div></aside>\n</section>\n\n<section class=\"slide slide-surface capabilities\" data-page=\"06\" data-title=\"One research question. Six connected systems.\" data-research-journey>\n <div class=\"kicker\">05 / A RESEARCHER’S JOURNEY</div>\n <h2 class=\"section-title\">One research question.<br><span class=\"highlight-text\">Six connected systems.</span></h2>\n <p class=\"subtitle\">Follow a paper-reproduction task from project setup to a result you can inspect.</p>\n <div class=\"content\">\n  <div class=\"journey-task\"><span class=\"task-label\">EXAMPLE TASK</span><p>I have the paper and the data. I want to reproduce the main result.</p><span class=\"journey-hint\">Choose a step to follow the workflow →</span></div>\n  <div class=\"journey-steps\" role=\"tablist\" aria-label=\"Six product systems across a researcher journey\">\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-1\" aria-selected=\"true\" aria-controls=\"journey-panel-1\" aria-label=\"Step 1: Set up the project\" tabindex=\"0\" data-journey-step=\"0\"><span class=\"journey-dot\">01</span><span class=\"journey-action\">Set up the project</span><span class=\"journey-capability\">Persistent context</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-2\" aria-selected=\"false\" aria-controls=\"journey-panel-2\" aria-label=\"Step 2: Load specialist capabilities\" tabindex=\"-1\" data-journey-step=\"1\"><span class=\"journey-dot\">02</span><span class=\"journey-action\">Load expertise</span><span class=\"journey-capability\">Specialists & Skills</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-3\" aria-selected=\"false\" aria-controls=\"journey-panel-3\" aria-label=\"Step 3: Choose models and runtime\" tabindex=\"-1\" data-journey-step=\"2\"><span class=\"journey-dot\">03</span><span class=\"journey-action\">Choose your stack</span><span class=\"journey-capability\">Model · Agent<br>Slurm / SSH · Runtime</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-4\" aria-selected=\"false\" aria-controls=\"journey-panel-4\" aria-label=\"Step 4: Approve the plan\" tabindex=\"-1\" data-journey-step=\"3\"><span class=\"journey-dot\">04</span><span class=\"journey-action\">Approve the plan</span><span class=\"journey-capability\">Orchestration &amp; permissions</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-5\" aria-selected=\"false\" aria-controls=\"journey-panel-5\" aria-label=\"Step 5: Inspect outputs and annotate only if needed\" tabindex=\"-1\" data-journey-step=\"4\"><span class=\"journey-dot\">05</span><span class=\"journey-action\">Inspect outputs</span><span class=\"journey-capability\">Artifact · Optional revision</span></button>\n   <button class=\"journey-step\" role=\"tab\" id=\"journey-tab-6\" aria-selected=\"false\" aria-controls=\"journey-panel-6\" aria-label=\"Step 6: Trace and review the reproduction evidence\" tabindex=\"-1\" data-journey-step=\"5\"><span class=\"journey-dot\">06</span><span class=\"journey-action\">Trace the evidence</span><span class=\"journey-capability\">Reviewer · Provenance</span></button>\n  </div>\n  <div class=\"journey-stage\">\n   <div class=\"journey-panel\" id=\"journey-panel-1\" role=\"tabpanel\" aria-labelledby=\"journey-tab-1\" data-journey-panel=\"0\">\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 01 / 06</p><h3 class=\"journey-detail-title\">Define the target before you begin.</h3><p class=\"journey-detail-copy\">Create a project, specify the result to reproduce, and add the paper and data. Every session that follows can use the same context.</p><p class=\"journey-result\"><span>OUTPUT</span>A project anchored in the question and source material</p><button class=\"journey-next\" data-journey-to=\"1\">Next: load specialist capabilities →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.512437810945274\"><figure class=\"crop shot\" data-crop=\"project|444,338,505,201\" style=\"aspect-ratio:505/201\"><img src=\"/open-science/assets/d13cf784f5a9e6bd.png\" alt=\"Open-Science project creation interface\" style=\"width:275.6435643564356%;left:-87.92079207920793%;top:-168.1592039800995%;height:auto\"></figure></div><figcaption>Create a project · Set the goal and context · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-2\" role=\"tabpanel\" aria-labelledby=\"journey-tab-2\" data-journey-panel=\"1\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 02 / 06</p><h3 class=\"journey-detail-title\">Bring the right expertise into the project.</h3><p class=\"journey-detail-copy\">Select a Specialist, load the Skills the task needs, and connect the right tools and data sources.</p><p class=\"journey-result\"><span>OUTPUT</span>A study-specific set of scientific capabilities</p><button class=\"journey-next\" data-journey-to=\"2\">Next: choose the model and runtime →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0668380462724936\"><figure class=\"crop shot\" data-crop=\"skills|599,386,804,389\" style=\"aspect-ratio:804/389\"><img src=\"/open-science/assets/860ec00c1fb345e1.png\" alt=\"Open-Science Skills interface for finding, adding and enabling capabilities\" style=\"width:222.63681592039802%;left:-74.50248756218906%;top:-99.22879177377892%;height:auto\"></figure></div><figcaption>Skills · Find and load on demand · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-3\" role=\"tabpanel\" aria-labelledby=\"journey-tab-3\" data-journey-panel=\"2\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 03 / 06</p><h3 class=\"journey-detail-title\">Choose how and where the work runs.</h3><p class=\"journey-detail-copy\">Select a model and agent, configure Python or R, then connect an SSH host or Slurm cluster when the study needs more compute.</p><p class=\"journey-result\"><span>OUTPUT</span>A stack matched to the study</p><button class=\"journey-next\" data-journey-to=\"3\">Next: approve the plan →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.858974358974359\"><figure class=\"crop shot\" data-crop=\"model|750,300,1450,780\" style=\"aspect-ratio:1450/780\"><img src=\"/open-science/assets/1c9871b2f41e1095.png\" alt=\"Open-Science model settings with provider and connection choices\" style=\"width:176.55172413793105%;left:-51.724137931034484%;top:-38.46153846153847%;height:auto\"></figure></div><figcaption>Model · Choose what the research uses · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-4\" role=\"tabpanel\" aria-labelledby=\"journey-tab-4\" data-journey-panel=\"3\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 04 / 06</p><h3 class=\"journey-detail-title\">Approve the plan before anything runs.</h3><p class=\"journey-detail-copy\">Review the plan and permissions. The main agent can then delegate work to sub-agents, call tools and run code while progress stays visible.</p><p class=\"journey-result\"><span>OUTPUT</span>Code, intermediate results and a complete run record</p><button class=\"journey-next\" data-journey-to=\"4\">Next: inspect the outputs →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.5078534031413613\"><figure class=\"crop shot\" data-crop=\"journeyPlan|0,0,1728,1146\" style=\"aspect-ratio:1728/1146\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science Session Plan with clarification, phased tasks and approval controls\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>Session Plan · Review before execution · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-5\" role=\"tabpanel\" aria-labelledby=\"journey-tab-5\" data-journey-panel=\"4\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 05 / 06</p><h3 class=\"journey-detail-title\">Review the result. Revise only if needed.</h3><p class=\"journey-detail-copy\">Figures, text and notebooks are ready to inspect or deliver. If a change is needed, select content or mark an image location and send it to the Agent.</p><p class=\"journey-result\"><span>OUTPUT</span>Reviewable outputs with an optional revision path</p><button class=\"journey-next\" data-journey-to=\"5\">Next: trace the evidence →</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:2.0416666667\"><figure class=\"crop shot\" data-crop=\"artifactAnnotation|1120,590,980,480\" style=\"aspect-ratio:980/480\"><img src=\"/open-science/assets/80d177354028b914.jpg\" alt=\"Open-Science artifact preview with an optional image-point annotation for the Agent\" style=\"width:218.6734693877551%;left:-114.28571428571428%;top:-122.91666666666667%;height:auto\"></figure></div><figcaption>Artifacts · Annotate only when a change is needed · Click to enlarge</figcaption></div>\n   </div>\n   <div class=\"journey-panel\" id=\"journey-panel-6\" role=\"tabpanel\" aria-labelledby=\"journey-tab-6\" data-journey-panel=\"5\" hidden>\n    <div class=\"journey-copy\"><p class=\"journey-step-note\">USER JOURNEY · 06 / 06</p><h3 class=\"journey-detail-title\">Trace the evidence behind the reproduction.</h3><p class=\"journey-detail-copy\">Compare it with the paper, inspect code, parameters and provenance, then revise the plan and rerun only what needs to change.</p><p class=\"journey-result\"><span>OUTPUT</span>Traceable evidence and a record of discrepancies</p><button class=\"journey-next\" data-journey-to=\"3\">↶ Revise the plan and continue</button></div>\n    <div class=\"journey-visual\"><div class=\"journey-visual-frame\" style=\"--journey-shot-ratio:1.7777777777777777\"><figure class=\"crop shot\" data-crop=\"reviewer|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/2ebc9a694ad40a1a.png\" alt=\"Open-Science Reviewer checking consistency across the plan, execution record and artifacts\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure></div><figcaption>Reviewer · Inspect results and review records · Click to enlarge</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Context, files and provenance stay with the project, so a discrepancy leads back to the step that produced it.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The paper-reproduction example turns six product systems into a researcher’s journey.</p><p>The researcher creates a project with the paper and data, loads the required Specialist and Skills, then chooses the model, agent, compute and runtime. Once the researcher describes the task, the main agent proposes a Plan. After the plan and permissions are approved, Sub-agents divide the work and call real tools. An output can be inspected or delivered as-is. Only when a change is needed does the researcher select text or mark a position in an image and send that context to the Agent; the revision becomes another Artifact Version. The Reviewer then checks the result against the execution record and provenance.</p><p>The six steps are a teaching model, not a mandatory workflow. Step 5 is primarily about inspecting outputs; Annotation is an optional revision path, not a required action. Project context, file management, permissions and provenance span the full journey. Researchers can return to earlier steps at any time. The final button returns to the planning stage; it does not claim that a background run has already restarted.</p><p>The task is illustrative, not a customer quote or performance claim. Screenshots come from different product demonstrations and are not presented as one continuous research run. A PASS in the Reviewer interface is not independent validation of every scientific conclusion.</p><p>Product capabilities were reviewed against v0.26.0 (2026-09-07). Support across Desktop, Web, Mobile and CLI/Headless varies by environment. MedFlow is marked SOON on the architecture slide.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 product interfaces and release materials; <a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">Annotations send selected artifact context to the Agent</a>. Research journey assembled from AIPOCH product materials.<br>Product screenshots: Project, Skills, Model, Session Plan, Artifacts, Annotation and Reviewer.</div></aside>\n</section>\n\n<section class=\"slide workspace\" data-page=\"07\" data-title=\"Research shouldn't start over when a conversation ends.\">\n <div class=\"kicker\">06 / RESEARCH WORKSPACE</div>\n <h2 class=\"section-title\">Research shouldn't start over when <span class=\"highlight-text\">a conversation ends</span></h2>\n <p class=\"subtitle\">Projects carry context, materials and decisions forward as the work evolves.</p>\n <div class=\"content workspace-gallery gallery\">\n  <div class=\"workspace-tabs\" role=\"tablist\" aria-label=\"Persistent research workspace features\">\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"workspace-project\"><span class=\"num\">01</span><span><b>Persistent projects and sessions</b><small>Keep conversations, files and outputs together.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-context\"><span class=\"num\">02</span><span><b>Shared project context</b><small>Carry goals, definitions and constraints into each new session.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-memory\"><span class=\"num\">03</span><span><b>Durable research memory</b><small>Carry stable preferences forward; verify time-sensitive claims.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-branch\"><span class=\"num\">04</span><span><b>Branch when the question changes</b><small>Explore a new path without losing the work behind it.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-reference\"><span class=\"num\">05</span><span><b>Find and cite earlier sessions</b><small>Use # to bring previous work into the current conversation.</small></span></button>\n   <button class=\"workspace-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"workspace-sidechat\"><span class=\"num\">06</span><span><b>Guide a live run</b><small>Add instructions or feedback through Side chat.</small></span></button>\n  </div>\n  <div class=\"workspace-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"workspace-project\" style=\"--workspace-shot-ratio:1.7777777777777777\"><figure class=\"crop\" data-crop=\"workspaceProject|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/b222df7f22573047.jpg\" alt=\"Open-Science project workspace with multiple sessions, files and outputs\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project workspace · Build research across sessions</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-context\" style=\"--workspace-shot-ratio:.7689822294022617\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceContext|0,0,476,619\" style=\"aspect-ratio:476/619\"><img src=\"/open-science/assets/bd4267932c391f0f.jpg\" alt=\"Open-Science Project Settings with Agent Context\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Project Agent Context · Carry shared goals into every session</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-memory\" style=\"--workspace-shot-ratio:1.3982808022922637\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"memory|0,0,976,698\" style=\"aspect-ratio:976/698\"><img src=\"/open-science/assets/4f45037e594fef5f.png\" alt=\"Open-Science Memory settings for durable research preferences and background\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>Research Profile · Carry stable preferences into future work</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-branch\" style=\"--workspace-shot-ratio:1.8333333333333333\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceBranch|600,800,1100,600\" style=\"aspect-ratio:1100/600\"><img src=\"/open-science/assets/4bb8c2a8d10c2112.jpg\" alt=\"Open-Science action for branching research into a new session\" style=\"width:181.72727272727275%;left:-54.54545454545454%;top:-133.33333333333331%;height:auto\"></figure><figcaption>Branch in new session · Explore another path from existing work</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-reference\" style=\"--workspace-shot-ratio:1.822\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceReference|0,0,911,500\" style=\"aspect-ratio:911/500\"><img src=\"/open-science/assets/beec2fa88029cfb7.jpg\" alt=\"Open-Science session search and reference menu\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption># Session reference · Find and continue earlier research</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"workspace-sidechat\" style=\"--workspace-shot-ratio:1.2857142857142858\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"workspaceSidechat|620,685,900,700\" style=\"aspect-ratio:900/700\"><img src=\"/open-science/assets/34b8bac0510d9049.png\" alt=\"Open-Science Side chat during a research run\" style=\"width:191.66666666666669%;left:-68.88888888888889%;top:-97.85714285714285%;height:auto\"></figure><figcaption>Side chat · Add guidance while the research is running</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Start a new session without starting the research over.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Research context belongs to the project, not to a single conversation.</p><p>Six product views demonstrate persistence: projects retain sessions and outputs; Project Agent Context carries shared goals and constraints; Research Profile stores stable preferences and long-running background; researchers can branch, reference earlier sessions with #, and add guidance through Side chat.</p><p>Memory is for durable preferences and context, not an exemption from verifying time-sensitive facts. Cross-session references use #, distinct from @ file references. “Continue the work” means restoring persistent records and context; it does not promise that every interrupted external compute job resumes automatically. Screenshots come from different demonstrations.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 product interfaces: Project Agent Context, Memory, Session References, Branch and Live Side chat. Six product screenshots supplied by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-surface literature\" data-page=\"08\" data-title=\"From literature discovery to evidence you can question and cite\">\n <div class=\"kicker\">07 / LITERATURE REFERENCE LIBRARY</div>\n <h2 class=\"section-title\">From literature discovery to<br><span class=\"highlight-text\">evidence you can question and cite</span></h2>\n <p class=\"subtitle\">Manage references, read full texts, and ask the Agent about a highlighted passage without losing its source.</p>\n <div class=\"content literature-interactive gallery\" data-gallery=\"literature\">\n  <div class=\"literature-tabs\" role=\"tablist\" aria-label=\"Literature Reference Library features\">\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"literature-library\"><span class=\"literature-num\">01</span><span><b>Library</b><small>Search across projects</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-reference\"><span class=\"literature-num\">02</span><span><b>Record</b><small>Metadata and project links</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-fulltext\"><span class=\"literature-num\">03</span><span><b>Read &amp; ask</b><small>Highlight a passage and ask</small></span></button>\n   <button class=\"literature-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"literature-citation\"><span class=\"literature-num\">04</span><span><b>Citations</b><small>Copy and export</small></span></button>\n  </div>\n  <div class=\"literature-visual shot\">\n   <div class=\"gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"literature-library\"><figure class=\"crop\" data-crop=\"literatureLibrary|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/cdc78c7a9691f76c.png\" alt=\"Open-Science Literature Library for searching, filtering, rating and deduplicating references\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>LIBRARY · Search, filter, rate and deduplicate across projects</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-reference\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureReference|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/e98f87a6d3b03588.png\" alt=\"Open-Science reference record with DOI, authors, tags, attachments and project links\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>RECORD · DOI, authors, tags, attachments and project links</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-fulltext\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureFullText|300,0,2260,1271\" style=\"aspect-ratio:2260/1271\"><img src=\"/open-science/assets/99c9442a1357e738.jpg\" alt=\"Open-Science highlighting a passage in a PDF and asking the Agent within the same research session\" style=\"width:113.27433628318585%;left:-13.274336283185843%;top:0%;height:auto\"></figure><figcaption>READ &amp; ASK · Highlight a passage and ask the Agent in context</figcaption></div>\n    <div class=\"gallery-panel\" data-panel=\"literature-citation\" aria-hidden=\"true\"><figure class=\"crop\" data-crop=\"literatureCitation|0,0,2560,1440\" style=\"aspect-ratio:2560/1440\"><img src=\"/open-science/assets/6e81dbe2ab53bdd6.png\" alt=\"Open-Science citation panel with formatted citations and BibTeX or RIS export\" style=\"width:100%;left:0%;top:0%;height:auto\"></figure><figcaption>CITATIONS · Copy common styles or export BibTeX / RIS</figcaption></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">A passage can move directly from the paper into a sourced research conversation.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The v0.26.0 Literature Reference Library connects discovery, in-context questions, project reuse and citation export.</p><p>The four tabs show the cross-project library, a reference record, reading and questions, and citation export. Researchers can search, filter, rate and deduplicate; retain DOI, authors, tags, attachments and project relationships; highlight a passage in the full text and ask the Agent within the paper's context; then copy a formatted citation or export BibTeX and RIS.</p><p>The screenshots show the product interface. They do not imply that every paper is available free of charge; access depends on public sources, licensing and the network environment. Researchers should verify the Agent's answer against the source text.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 Literature Reference Library screenshots: 03.png, 04-2.png and 05-2.png, supplied on 2026-09-07. Reading and in-context question screenshot supplied on 2026-09-08.</div></aside>\n</section>\n\n<section class=\"slide slide-surface freedom\" data-page=\"09\" data-title=\"Build the stack around the research\">\n <div class=\"kicker\">08 / YOUR RESEARCH, YOUR STACK</div>\n <h2 class=\"section-title\">Build the stack <span class=\"highlight-text\">around the research</span></h2>\n <p class=\"subtitle\">Choose the right tools for each task—and switch them as the work evolves.</p>\n <div class=\"content split\"><div class=\"freedom-list\">\n <div class=\"feature-line\"><span class=\"num\">01</span><div><h3>Pick the agent</h3><p>Four frameworks: Claude Agent, OpenCode, Codex and CodeBuddy.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">02</span><div><h3>Choose the model</h3><p>Fifteen official providers, custom gateways and in-task switching.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">03</span><div><h3>Bring your own compute</h3><p>Run locally, over SSH or on a Slurm cluster.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">04</span><div><h3>Set the runtime</h3><p>Python, R and REPL kernels with repair and network protection.</p></div></div>\n <div class=\"feature-line\"><span class=\"num\">05</span><div><h3>Connect your data</h3><p>Project files, 24 research Connectors, 200+ tools and custom MCP.</p></div></div>\n </div><div class=\"gallery\" data-gallery=\"stack\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Technology choices\"><button role=\"tab\" aria-selected=\"true\" data-select=\"model\">Model</button><button role=\"tab\" aria-selected=\"false\" data-select=\"agent\">Agent</button><button role=\"tab\" aria-selected=\"false\" data-select=\"runtime\">Runtime</button><button role=\"tab\" aria-selected=\"false\" data-select=\"compute\">Compute</button><button role=\"tab\" aria-selected=\"false\" data-select=\"data\">Data</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel active\" data-panel=\"model\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"model|780,355,1000,730\" style=\"aspect-ratio:1000/730\"><img src=\"/open-science/assets/1c9871b2f41e1095.png\" alt=\"Open-Science model settings with OpenAI and GPT-6 Astra, Sol, Terra and Luna models\" style=\"width:256%;left:-78%;top:-48.63013698630137%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"agent\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"agent|780,355,1000,730\" style=\"aspect-ratio:1000/730\"><img src=\"/open-science/assets/9c6f7f5a376fe26f.jpg\" alt=\"Open-Science agent settings with Claude Agent, OpenCode, Codex and CodeBuddy\" style=\"width:256%;left:-78%;top:-48.63013698630137%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"runtime\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"runtime|780,355,1000,730\" style=\"aspect-ratio:1000/730\"><img src=\"/open-science/assets/cbee18bbb2a7315c.png\" alt=\"Open-Science runtime settings with Python, R, package management, repair and network protection\" style=\"width:256%;left:-78%;top:-48.63013698630137%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"compute\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"compute|780,355,1000,730\" style=\"aspect-ratio:1000/730\"><img src=\"/open-science/assets/2a7efe315b7b7b67.png\" alt=\"Open-Science compute settings for remote SSH hosts and Slurm scheduling\" style=\"width:256%;left:-78%;top:-48.63013698630137%;height:auto\"></figure></div>\n <div class=\"gallery-panel\" data-panel=\"data\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"connectors|780,355,1000,730\" style=\"aspect-ratio:1000/730\"><img src=\"/open-science/assets/9d0b9408ccb8a7fa.png\" alt=\"Open-Science Connectors for research services, local commands, remote MCP and imported configurations\" style=\"width:256%;left:-78%;top:-48.63013698630137%;height:auto\"></figure></div>\n </div><div class=\"shot-caption\"><span>BUILD YOUR STACK</span><span>SELECT A TAB TO VIEW THE PRODUCT</span></div><p class=\"small-note\">If you use third-party models, remote services or connectors, their data policies and pricing apply.</p></div></div>\n <p class=\"summary\">The stack can change. The research goal and every major choice stay with the researcher.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Build the stack around the research instead of locking the research into one stack.</p><p>The v0.26.0 interfaces show four agent frameworks, fifteen official model providers, custom gateways, Python/R/REPL runtimes, SSH and Slurm compute, plus 24 research Connectors and more than 200 tools. Exact availability can vary by version and configuration.</p><p>The Data tab shows the Connectors page. Researchers can browse available connectors or add one through a local command, remote MCP service or imported configuration. Specific connectors shown are interface examples.</p><p>When cloud models, remote endpoints or third-party connectors are used, requests may be sent to those services. Local-first does not mean data remains on-device under every configuration. Availability varies by framework, service and execution environment.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 interfaces and README; Model, Agent, Runtime, Compute and Connectors screenshots supplied on 2026-09-07.</div></aside>\n</section>\n\n<section class=\"slide ecosystem\" data-page=\"10\" data-title=\"Load the expertise your research needs\">\n <div class=\"kicker\">09 / SPECIALISTS & SKILLS</div>\n <h2 class=\"section-title\">Load the expertise <span class=\"highlight-text\">your research needs</span></h2>\n <p class=\"subtitle\">Specialists provide domain context. Skills package methods that can be called, combined and shared.</p>\n <div class=\"content\"><div class=\"gallery\" data-gallery=\"capabilities\"><div class=\"gallery-nav\" role=\"tablist\" aria-label=\"Specialists and Skills product views\"><button role=\"tab\" aria-selected=\"false\" data-select=\"specialists\">Specialists</button><button role=\"tab\" aria-selected=\"true\" data-select=\"skills\">Skills</button></div><div class=\"gallery-frame shot\">\n <div class=\"gallery-panel\" data-panel=\"specialists\" role=\"tabpanel\"><figure class=\"crop specialist-shot\" data-crop=\"specialists|160,300,960,530\" style=\"aspect-ratio:960/530\"><img src=\"/open-science/assets/491a3968cb94db41.png\" alt=\"Specialist Marketplace with aerodynamics, astronomical photometry and atmospheric chemistry packages\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-56.60377358490566%;height:auto\"></figure></div>\n <div class=\"gallery-panel active\" data-panel=\"skills\" role=\"tabpanel\"><figure class=\"crop\" data-crop=\"skillsLatest|160,150,960,560\" style=\"aspect-ratio:960/560\"><img src=\"/open-science/assets/a5240cb3645ee9d5.png\" alt=\"Open-Science Skills interface for browsing, enabling, uploading, importing and creating Skills\" style=\"width:133.33333333333331%;left:-16.666666666666664%;top:-26.785714285714285%;height:auto\"></figure></div></div><div class=\"skill-points\"><p><span>01</span><span class=\"skill-copy\"><b>Across disciplines:</b> Specialists and Skills span life science, medicine, chemistry, physics, astronomy, environmental science, engineering and data science.</span></p><p><span>02</span><span class=\"skill-copy\"><b>Yours to load, adapt and publish:</b> create a Skill in natural language, upload a package, import from GitHub or publish your own to the Marketplace.</span></p></div></div>\n <div><div class=\"sources-head\"><span class=\"label\">OPEN SKILL MARKETPLACE · USE, BUILD, CONTRIBUTE</span></div>\n <a class=\"source-row\" href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/cd170c5207db62ba.png\" alt=\"K-Dense mark\"><div class=\"source-copy\"><div class=\"source-name\">K-Dense <span class=\"source-stats\">34.8K ★ ↗</span></div><p class=\"source-desc\">Scientific Agent Skills · Research and analysis across disciplines</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/4124b8d03b154d23.png\" alt=\"Anthropic mark\"><div class=\"source-copy\"><div class=\"source-name\">Claude Skills <span class=\"source-stats\">171.9K ★ ↗</span></div><p class=\"source-desc\">Anthropic Agent Skills · Document, design and developer workflows</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/5d9fa88bda04c547.png\" alt=\"Google DeepMind mark\"><div class=\"source-copy\"><div class=\"source-name\">Google DeepMind <span class=\"source-stats\">2.8K ★ ↗</span></div><p class=\"source-desc\">Science Skills · Genomics, structural biology and scientific search</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo nature-logo\" src=\"/open-science/assets/3b16f5fd9a4fca0f.png\" alt=\"Nature Skills project mark\"><div class=\"source-copy\"><div class=\"source-name\">Nature Skills <span class=\"source-stats\">37.3K ★ ↗</span></div><p class=\"source-desc\">Scientific discovery, writing, visualization and peer review</p></div></a>\n <a class=\"source-row\" href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\"><img class=\"source-logo\" src=\"/open-science/assets/9cc9bee9a501b541.png\" alt=\"NVIDIA mark\"><div class=\"source-copy\"><div class=\"source-name\">NVIDIA BioNeMo <span class=\"source-stats\">434 ★ ↗</span></div><p class=\"source-desc\">BioNeMo Agent Toolkit · Protein, molecule and genomics workflows</p></div></a>\n <div class=\"marketplace-contribute\"><span class=\"contribute-mark\">＋</span><div><b>PUBLISH YOUR SKILL</b><p>Share it through the Marketplace so others can inspect, load, test and improve it.</p></div></div>\n </div>\n </div>\n <p class=\"summary\">Find what you need, adapt it to the study, and return what you learn to the community.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Researchers can be both users and contributors of open scientific capability.</p><p>A Specialist is a capability package for a defined professional scope and may include dedicated Skills and Connectors. A Skill is a scientific capability that can be called and combined independently. Open-Science supports enabling Skills on demand, uploading packages, importing from GitHub or installed directories, and creating a personal Skill through conversation or an editor.</p><p>Skills created or maintained by users can be published to the Marketplace, where other researchers can load, validate, reuse, discuss and improve them. The result is an open loop of use, creation, publication, reuse and improvement.</p><p>The eight-plus domains summarize representative Specialists and open Skill collections; they are not a fixed taxonomy. GitHub star figures are a snapshot from 2026-08-27.</p><div class=\"sources\">[Sources]<br>Open-Science Skills screenshot, Specialist Marketplace screenshot and feature list supplied by AIPOCH; Marketplace publishing behavior confirmed on 2026-08-27.<br><a href=\"https://github.com/K-Dense-AI/scientific-agent-skills\" target=\"_blank\" rel=\"noopener\">K-Dense Scientific Agent Skills</a><br><a href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener\">Anthropic Skills</a><br><a href=\"https://github.com/google-deepmind/science-skills\" target=\"_blank\" rel=\"noopener\">Google DeepMind Science Skills</a><br><a href=\"https://github.com/Yuan1z0825/nature-skills\" target=\"_blank\" rel=\"noopener\">Nature Skills</a><br><a href=\"https://github.com/NVIDIA-BioNeMo/bionemo-agent-toolkit\" target=\"_blank\" rel=\"noopener\">NVIDIA BioNeMo Agent Toolkit</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark execution\" data-page=\"11\" data-title=\"Put scientific capabilities to work\">\n <div class=\"kicker\">10 / SCIENTIFIC EXECUTION</div>\n <h2 class=\"section-title\">Put scientific capabilities <span class=\"highlight-text\">to work</span></h2>\n <p class=\"subtitle\">You set the task; the agent proposes a plan, and once you approve it, sub-agents split the work while a Reviewer Specialist checks the result.</p>\n <div class=\"execution-interactive gallery\" data-gallery=\"execution\">\n  <div class=\"execution-tabs\" role=\"tablist\" aria-label=\"Four stages of real research execution\">\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"execution-plan\"><span class=\"execution-num\">01</span><span><b>Define the task</b><small>Agent proposes · Researcher approves</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-delegate\"><span class=\"execution-num\">02</span><span><b>Delegate the work</b><small>Main agent → Sub-agents</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-run\"><span class=\"execution-num\">03</span><span><b>Run with real tools</b><small>Skill · Connector · Compute</small></span></button>\n   <button class=\"execution-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"execution-review\"><span class=\"execution-num\">04</span><span><b>Review the result</b><small>Method · Evidence · Claim · Record</small></span></button>\n  </div>\n  <div class=\"execution-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"execution-plan\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / TASK → PLAN → APPROVAL</strong><span>The researcher approves the direction before execution</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"journeyPlan|850,0,878,650\" style=\"aspect-ratio:878/650\"><img src=\"/open-science/assets/b9044b9da27412d6.png\" alt=\"Open-Science creates a structured Session Plan from the research task and waits for approval\" style=\"width:196.8109339407745%;left:-96.81093394077449%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>A STRUCTURED PLAN BEFORE EXECUTION</span><span>Goals · Steps · Boundaries · Deliverables</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-delegate\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / COMPLEX WORK → SPECIALIST TASKS</strong><span>Session-level Delegation controls each branch</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"subagents|75,250,900,340\" style=\"aspect-ratio:900/340\"><img src=\"/open-science/assets/6dac6a590e97efcb.png\" alt=\"Open-Science delegates work to five sub-agents and displays their status\" style=\"width:115.44444444444444%;left:-8.333333333333332%;top:-73.52941176470588%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SESSION DELEGATION · 5 SUB-AGENTS</span><span>Task · Specialist role · Status</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-run\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / EXECUTE IN REAL ENVIRONMENTS</strong><span>New Tool Summary Cards consolidate calls and status</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"live|520,720,1100,520\" style=\"aspect-ratio:1100/520\"><img src=\"/open-science/assets/b1110a6a25a8964a.png\" alt=\"Open-Science research session with Notebook, real tool calls, run status and delegation controls\" style=\"width:232.72727272727272%;left:-47.27272727272727%;top:-138.46153846153845%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>SKILL · CONNECTOR · PYTHON / R · REMOTE COMPUTE</span><span>Tool summaries · Status · Artifacts</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"execution-review\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / EXECUTE &amp; REVIEW</strong><span>The Reviewer Specialist checks the record; expert judgment still decides</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot execution-focus\" data-crop=\"reviewer|1460,0,1100,720\" style=\"aspect-ratio:1100/720\"><img src=\"/open-science/assets/2ebc9a694ad40a1a.png\" alt=\"Open-Science Reviewer checking consistency across the plan, execution record and artifacts\" style=\"width:232.72727272727272%;left:-132.72727272727275%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PLAN · EXECUTION · ARTIFACT · CLAIM</span><span>Method · Evidence · Conclusion · Record</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">You steer the research. The main agent coordinates, sub-agents execute, and the Reviewer Specialist checks the work.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The researcher defines the task, the main agent drafts the plan, sub-agents execute in parallel and a Reviewer Specialist checks the result.</p><p>This slide is an interactive four-stage walkthrough: Task / Plan, session-level Delegation, real execution and Execute / Review. The agent first turns the task and project context into a structured plan with goals, steps, boundaries and deliverables. The main agent begins decomposition and coordination only after the researcher has reviewed and approved the plan.</p><p>Sub-agents can handle clarification, literature collection, evidence mapping, gap analysis and route selection, calling Skills, Connectors, Python/R and local or remote compute. New Tool Summary Cards consolidate tool calls, status and artifacts. The Reviewer Specialist checks methods, evidence, claims and execution records. It is a review mechanism, not a guarantee that the scientific conclusion is correct.</p><p>The four views are real product interfaces from different demonstrations; they are not presented as one continuous run.</p><div class=\"sources\">[Sources]<br>Open-Science v0.26.0 product interfaces and feature materials; product logic confirmed on 2026-09-07. Session Plan, Sub-agents, tool execution and Session Reviewer screenshots supplied by AIPOCH.<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science product page</a></div></aside>\n</section>\n\n<section class=\"slide slide-dark evidence\" data-page=\"12\" data-title=\"Keep every file together. Trace every result back.\">\n <div class=\"kicker\">11 / DATA, ARTIFACTS & TRUST</div>\n <h2 class=\"section-title\">Keep every file together.<br><span class=\"highlight-text\">Trace every result back.</span></h2>\n <p class=\"subtitle\">Source material, execution records and final artifacts stay linked inside the project.</p>\n <div class=\"evidence-interactive gallery\" data-gallery=\"evidence\">\n  <div class=\"evidence-tabs\" role=\"tablist\" aria-label=\"Four ways Open-Science manages materials, outputs and trust\">\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"true\" data-select=\"evidence-materials\"><span class=\"evidence-num\">01</span><span><b>MATERIALS</b><small>Manage project files, attachments up to 10 GB, and @ / # references.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-artifacts\"><span class=\"evidence-num\">02</span><span><b>ARTIFACTS</b><small>Inspect or deliver as-is; annotate only when a revision is needed.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-provenance\"><span class=\"evidence-num\">03</span><span><b>PROVENANCE</b><small>Link the Execution Log to inputs, code and environment.</small></span></button>\n   <button class=\"evidence-tab\" role=\"tab\" aria-selected=\"false\" data-select=\"evidence-control\"><span class=\"evidence-num\">04</span><span><b>CONTROL</b><small>Set network boundaries for Notebooks and Connectors by domain.</small></span></button>\n  </div>\n  <div class=\"evidence-visual\">\n   <div class=\"execution-gallery-frame\">\n    <div class=\"gallery-panel active\" data-panel=\"evidence-materials\" role=\"tabpanel\"><div class=\"execution-panel-head\"><strong>01 / REFERENCES &amp; FILES</strong><span>Add, organize and reference source material</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceMaterials|0,500,2113,780\" style=\"aspect-ratio:2113/780\"><img src=\"/open-science/assets/840a5021386b1c69.jpg\" alt=\"Open-Science Files with uploaded materials, generated files and in-session file references\" style=\"width:100%;left:0%;top:-64.1025641025641%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>PROJECT FILES · UPLOADS · GENERATED FILES</span><span>@ FILES · # SESSIONS</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-artifacts\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>02 / REVIEW · ANNOTATE IF NEEDED</strong><span>Review first; annotate only when a specific change is needed</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"artifactAnnotation|1010,420,1100,650\" style=\"aspect-ratio:1100/650\"><img src=\"/open-science/assets/80d177354028b914.jpg\" alt=\"Open-Science artifact with an optional image-point annotation that adds revision context for the Agent\" style=\"width:194.8181818181818%;left:-91.81818181818183%;top:-64.61538461538461%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>VIEW · OPTIONAL ANNOTATION · VERSION</span><span>Deliver as-is · Revise when needed</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-provenance\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>03 / PROVENANCE</strong><span>Trace an artifact back to code, tool calls and environment</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceProvenance|1480,0,1080,720\" style=\"aspect-ratio:1080/720\"><img src=\"/open-science/assets/acda349e68bde787.png\" alt=\"Open-Science artifact Execution Log retaining code, tool calls, inputs and output\" style=\"width:237.037037037037%;left:-137.03703703703704%;top:0%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>CODE · EXECUTION LOG · ENVIRONMENT</span><span>The run record persists</span></div></div>\n    <div class=\"gallery-panel\" data-panel=\"evidence-control\" role=\"tabpanel\" aria-hidden=\"true\"><div class=\"execution-panel-head\"><strong>04 / CONTROL</strong><span>Define network boundaries for Notebooks and Connectors</span></div><div class=\"execution-panel-body\"><figure class=\"crop shot evidence-focus\" data-crop=\"evidenceControl|580,250,1400,950\" style=\"aspect-ratio:1400/950\"><img src=\"/open-science/assets/dd683e15331a1936.png\" alt=\"Open-Science Network settings for domain-based Notebook and Connector access\" style=\"width:182.85714285714286%;left:-41.42857142857143%;top:-26.31578947368421%;height:auto\"></figure></div><div class=\"execution-panel-caption\"><span>NOTEBOOK · CONNECTORS · DOMAIN RULES</span><span>Controlled access · Network protection</span></div></div>\n   </div>\n  </div>\n </div>\n <p class=\"summary\">Every result can be inspected or delivered as-is, with optional revision, provenance and control when needed.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Materials, artifacts, optional revisions, version records, execution history and network boundaries remain linked inside the same project.</p><p>Materials shows uploads, generated files and @ references. Artifacts are ready to inspect or deliver as-is. Only when a change is needed does the researcher select text or mark a location in an image and send that context to the Agent as an Annotation. The Agent’s revised output becomes another Artifact Version for inspection and comparison. Provenance connects an artifact to its Execution Log, code, tool calls and environment. Control shows domain-based network access for Notebooks and Connectors.</p><p>File support includes attachments up to 10 GB, a project library, @ file and path references, # cross-session references, and previews for data, notebooks, images, PDFs, Office files and chemical structures. Availability and limits vary by client, environment and file type.</p><p>Artifact versioning and Compare arrived in v0.25. Annotations are included in the implemented v0.26.0 capability set as an optional revision path, not a required workflow step. Network sandboxing and domain controls have expanded since v0.24. Screenshots come from different product demonstrations and illustrate the interfaces only.</p><div class=\"sources\">[Sources]<br>Open-Science v0.24–v0.26 release materials; <a href=\"https://github.com/aipoch/open-science/pull/1815\" target=\"_blank\" rel=\"noopener\">PR #1815: annotations send selected artifact context to the Agent</a>; Files, Annotation, Execution Log and Network screenshots supplied on 2026-09-07 and 2026-09-08.</div></aside>\n</section>\n\n<section class=\"slide architecture\" data-page=\"13\" data-title=\"AIPOCH is building the infrastructure for open research\">\n <div class=\"kicker\">12 / THE AIPOCH PRODUCT ARCHITECTURE</div>\n <h2 class=\"section-title\">AIPOCH is building the infrastructure <span class=\"highlight-text\">for open research</span></h2>\n <p class=\"subtitle\">Open-Science is the public workbench, supported by specialist capabilities, execution engines and technical services.</p>\n <div class=\"content\"><img class=\"architecture-image\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"AIPOCH product architecture represented as a building with services, capabilities, execution and an open research space\">\n <div class=\"architecture-layers\">\n <div class=\"architecture-layer\"><div class=\"en\">01 / OPEN RESEARCH SPACE</div><h3>Open-Science</h3><p>The open workbench and community entry point<span class=\"benchmark-result\"><b>#1</b>OPEN-SCIENCE · BIOMNIBENCH-DA PUBLIC 50</span></p></div>\n <div class=\"architecture-layer\"><div class=\"en\">02 / EXECUTION ENGINE</div><h3>MedFlow <span class=\"status planned\" style=\"margin-left:14px\">SOON</span></h3><p>Coming soon: resumable research workflows built from specialist capabilities</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">03 / SCIENTIFIC CAPABILITIES</div><h3>Specialists · Skills · Connectors</h3><p>MedSkillAudit: Skill audits and ratings · public benchmarks and leaderboards</p></div>\n <div class=\"architecture-layer\"><div class=\"en\">04 / TECHNICAL FOUNDATION</div><h3>Model · Agent · Compute</h3><p>Runtime, environment and data services</p></div>\n </div><span class=\"architecture-pin\" style=\"left:1135px;top:81px\">01</span><span class=\"architecture-pin\" style=\"left:1050px;top:199px\">02</span><span class=\"architecture-pin\" style=\"left:1090px;top:309px\">03</span><span class=\"architecture-pin\" style=\"left:1040px;top:439px\">04</span><div class=\"architecture-community\"><strong>GLOBAL OPEN RESEARCH COMMUNITY</strong>　Contribute · Review · Collaborate · Reuse</div></div>\n <p class=\"summary\">AIPOCH turns models, tools and research expertise into capabilities the global community can use and improve.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">The architecture is shown from the AIPOCH company perspective: Open-Science is the open entry point, supported by execution, capability and technical layers.</p><p>The upper space is Open-Science, containing projects, sessions, context, files and research outputs. MedFlow is marked SOON and is intended to organize validated capabilities into executable, recoverable workflows. The capability layer contains Specialists, Skills and Connectors. MedSkillAudit is live for Skill audits and ratings, with public entry points for Benchmark and Leaderboard work. Open-Science ranks first on BiomniBench-DA Public 50. The foundation provides models, agents, compute, environments and data services.</p><p>This is a conceptual product architecture, not a deployment topology. The space around the building represents the global open research community contributing, validating, collaborating and reusing capabilities.</p><div class=\"sources\">[Sources]<br>AIPOCH 2026 mid-year architecture artwork; architecture framing and product status confirmed by AIPOCH; Open-Science v0.26.0 product materials; first-place BiomniBench-DA Public 50 result supplied by AIPOCH; <a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH website</a>.</div></aside>\n</section>\n\n<section class=\"slide slide-dark cobuild\" data-page=\"14\" data-title=\"A global community can take research further\">\n <div class=\"kicker\">13 / BUILT BY THE RESEARCH COMMUNITY</div>\n <h2 class=\"section-title\">A global community can take <span class=\"highlight-text\">research further</span></h2>\n <p class=\"subtitle\">Researchers, domain experts, developers and institutions contribute the methods and tools; AIPOCH supports the places and programs that bring them together.</p>\n <div class=\"content\"><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">RESEARCHERS</div><h3>Researchers</h3><p>Use community-built capabilities<br>and bring back real questions.</p></div><div class=\"role\"><div class=\"role-en\">DOMAIN EXPERTS</div><h3>Domain experts</h3><p>Package methods and judgment<br>as Specialists or Skills.</p></div></div><div class=\"community-core\"><div class=\"radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><div><strong>Open-<br>Science</strong><span class=\"mini\">OPEN TO CONTRIBUTION</span></div></div><div class=\"role-column\"><div class=\"role\"><div class=\"role-en\">DEVELOPERS</div><h3>Developers</h3><p>Connect tools, data sources<br>and workflow components.</p></div><div class=\"role\"><div class=\"role-en\">RESEARCH INSTITUTIONS</div><h3>Institutions</h3><p>Run validation, reproduction<br>and collaborative studies.</p></div></div></div>\n <div class=\"community-support\"><div class=\"support-brand\"><img class=\"community-sticker\" src=\"/open-science/assets/fc401060a5053e19.png\" alt=\"Hi, AIPOCH pixel sticker for community support\"><div><span>AIPOCH / COMMUNITY CONVENER</span><b>Bringing people and infrastructure<br>together</b></div></div><div class=\"support-items\"><div class=\"support-item\"><small>01 / INFRASTRUCTURE</small><strong>Open infrastructure</strong></div><div class=\"support-item\"><small>02 / WORKSHOPS</small><strong>Online &amp; in-person workshops</strong></div><div class=\"support-item\"><small>03 / CO-RESEARCH</small><strong>Collaborative projects with research groups</strong></div><div class=\"support-item\"><small>04 / MARKETPLACE</small><strong>Skills Hub<br>Specialist Marketplace</strong></div></div></div>\n <aside class=\"notes\"><p class=\"speaker-summary\">The community contributes scientific capability; AIPOCH provides infrastructure, programs and collaboration mechanisms that help co-creation continue.</p><p>The community has four roles: researchers, domain experts, developers and research institutions. Researchers use capabilities and return real problems. Domain experts codify Specialists and Skills. Developers connect tools, data sources and workflow components. Institutions support validation, reproduction and collaborative research.</p><p>AIPOCH is not a fifth community role. It convenes and supports the community through open infrastructure, online and in-person workshops, research-group collaborations, a Skills Hub and a Specialist Marketplace. Contributors decide what to publish; private research data does not have to be made public. Research collaborations are agreed project by project.</p><div class=\"sources\">[Sources]<br>Global open research community positioning, four contribution roles and AIPOCH support model specified by AIPOCH. Pixel-sticker artwork supplied and adapted for this deck.</div></aside>\n</section>\n\n<section class=\"slide team-pitch\" data-page=\"15\" data-title=\"The AIPOCH team\">\n <div class=\"kicker\">14 / AIPOCH CORE TEAM</div>\n <h2 class=\"section-title\">The AIPOCH <span class=\"highlight-text\">team</span></h2>\n <p class=\"subtitle\">AIPOCH brings medical research, AI engineering, product development and research delivery into one team—so a partnership can move from a real question to something testable.</p>\n <div class=\"content\">\n  <div class=\"team-grid\">\n   <article class=\"team-card\"><div class=\"team-role\">CEO · RESEARCH COMMERCIALIZATION</div><h3>Huimei Wang, PhD</h3><p class=\"team-focus\">Serial entrepreneur in medical research commercialization</p><div class=\"team-facts\"><span>PhD &amp; postdoc, Zhongshan Hospital, Fudan University</span><span>20+ SCI papers · 15 invention patents</span><span>9+ years in research services and team leadership</span></div><p class=\"team-contribution\">Real needs · institutions · commercialization</p></article>\n   <article class=\"team-card\"><div class=\"team-role\">HEAD OF AI · AGENT ENGINEERING</div><h3>Wen Ouyang</h3><p class=\"team-focus\">Medical research agents and AI systems engineering</p><div class=\"team-facts\"><span>Master’s, Shanghai Jiao Tong University School of Medicine</span><span>3 years in AI for medical research</span><span>LLMs · agents · workflow engineering</span></div><p class=\"team-contribution\">Architecture · executable capability</p></article>\n   <article class=\"team-card\"><div class=\"team-role\">PRODUCT &amp; GROWTH · GLOBAL</div><h3>Qianyu Yao</h3><p class=\"team-focus\">AI4Science product portfolio and global growth</p><div class=\"team-facts\"><span>Immunology, University of Melbourne</span><span>Previously at Apple and Sanofi</span><span>10+ research AI products · 300K+ users reached</span></div><p class=\"team-contribution\">Product strategy · validation · growth</p></article>\n   <article class=\"team-card\"><div class=\"team-role\">HEAD OF RESEARCH · QUALITY</div><h3>Bocheng Huang</h3><p class=\"team-focus\">Bioinformatics, clinical research and research delivery</p><div class=\"team-facts\"><span>Master’s in Bioinformatics, University of Melbourne</span><span>6+ years in medical data analysis</span><span>1,000+ medical research projects delivered</span></div><p class=\"team-contribution\">Methods · validation standards · quality</p></article>\n  </div>\n  <div class=\"partner-flow\"><div class=\"partner-step\"><small>YOU / DOMAIN EXPERT</small><strong>Define the method and the bar for quality</strong></div><div class=\"partner-arrow\">→</div><div class=\"partner-step\"><small>AIPOCH / PRODUCT &amp; ENGINEERING</small><strong>Build the Specialist, Skill or Workflow</strong></div><div class=\"partner-arrow\">→</div><div class=\"partner-step\"><small>TOGETHER / REAL PROJECT</small><strong>Test it on real work, then keep improving it</strong></div></div>\n </div>\n <p class=\"summary\">You do not have to become a software team. AIPOCH turns your method into something researchers can run, inspect and improve.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">Experts who work with AIPOCH get more than an AI tool: they get a cross-functional team that can take a scientific method all the way into a usable product.</p><p>Huimei Wang brings research commercialization, institutional relationships and go-to-market leadership. Wen Ouyang leads agents, models, tools and workflow engineering. Qianyu Yao leads product definition, user validation and global growth. Bocheng Huang owns research methods, statistical pathways and scientific quality.</p><p>A partnership can begin with one tightly scoped research problem. The expert defines the method, quality bar and limits of use. AIPOCH turns that knowledge into a Specialist, Skill or Workflow, then the two sides validate it on real work and decide together how—if at all—it should be published. The expert retains scientific judgment and control over what is shared.</p><div class=\"sources\">[Sources]<br>AIPOCH internal team profile, 2 Sep 2026; <a href=\"https://aipoch.com\" target=\"_blank\" rel=\"noopener\">AIPOCH website</a>; <a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science on GitHub</a>. All biographies and figures are condensed from materials supplied by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-surface flywheel\" data-page=\"16\" data-title=\"What one project learns can move the next one forward\">\n <div class=\"kicker\">15 / KNOWLEDGE THAT OTHERS CAN BUILD ON</div>\n <h2 class=\"section-title\">What one project learns can<br><span class=\"highlight-text\">move the next one forward</span></h2>\n <div class=\"content\"><div><p class=\"body-text\">Once methods and hard-won research practice are tested and shared, they do not have to disappear into a final report.</p><div class=\"participation\"><div><b>USE</b><span>Apply an existing capability</span></div><div><b>CONTRIBUTE</b><span>Share a method or component</span></div><div><b>VALIDATE</b><span>Review, reproduce, challenge</span></div><div><b>CO-CREATE</b><span>Work together on a real question</span></div></div><p class=\"fine\" style=\"margin-top:29px\">A model AIPOCH aims to build with the global research community.</p></div><div class=\"wheel\"><div class=\"wheel-track\"></div><div class=\"wheel-center\">Shared<br>capability<small>TESTED · REUSABLE</small></div><div class=\"wheel-node wn1\"><b>01</b><span>Research question</span><small>Start with a real need</small></div><div class=\"wheel-node wn2\"><b>02</b><span>Collaborate</span><small>Bring the right disciplines together</small></div><div class=\"wheel-node wn3\"><b>03</b><span>Package the method</span><small>Skill or Workflow</small></div><div class=\"wheel-node wn4\"><b>04</b><span>Test it</span><small>Methods, limits, results</small></div><div class=\"wheel-node wn5\"><b>05</b><span>Publish &amp; reuse</span><small>Keep source and version</small></div><div class=\"wheel-node wn6\"><b>06</b><span>Learn from use</span><small>New cases, better capability</small></div></div></div>\n <p class=\"summary\">Let the next researcher begin with everything the last project learned.</p>\n <aside class=\"notes\"><p class=\"speaker-summary\">When a method is tested, documented and shared, the next project can start with more than a blank page.</p><p>The community loop begins with a real question, moves through collaborative research, packaging, testing and publication, then improves through new use. Contributions can take the form of Specialists, Skills, Connectors or Workflows.</p><p>This slide describes the collaboration model AIPOCH aims to build. It does not imply that every review, publishing, governance or partnership workflow is already available as a product feature. A hosted public Skill Commons and live cross-institution collaboration remain future directions.</p><div class=\"sources\">[Sources]<br>Community vision, contribution loop and future directions confirmed by AIPOCH.</div></aside>\n</section>\n\n<section class=\"slide slide-dark closing\" data-page=\"17\" data-title=\"Build Science in the Open\">\n <div class=\"decor radar\"><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div><div class=\"radar-circle\"></div></div><img class=\"decor building-ghost\" src=\"/open-science/assets/a74bf485a1636753.png\" alt=\"Open research infrastructure connected to a global community\">\n <div class=\"kicker\" style=\"color:#b4b4ae\">AIPOCH / OPEN-SCIENCE</div>\n <h2 class=\"closing-title\">Build Science<br>in the <span class=\"highlight-text en\">Open.</span></h2>\n <p class=\"closing-sub\">Put research expertise to work.<br>On your terms.</p>\n <div class=\"closing-label\">A GLOBAL<br>OPEN RESEARCH<br>COMMUNITY<span class=\"version\">PRODUCT SNAPSHOT<br>v0.26.0 · 2026.09</span></div>\n <div class=\"closing-links\"><a class=\"closing-link\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><b>Explore Open-Science ↗</b><span>AIPOCH.COM/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\"><b>Build with us on GitHub ↗</b><span>GITHUB.COM/AIPOCH/OPEN-SCIENCE</span></a><a class=\"closing-link\" href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\"><b>Partner with AIPOCH ↗</b><span>AIPOCH.COM/CONTACT-US</span></a></div>\n <a class=\"qr-block\" href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\"><img src=\"/open-science/assets/fe24c474cce9b5ba.svg\" alt=\"QR code for the Open-Science product page\"><p>Explore Open-Science</p></a>\n <aside class=\"notes\"><p class=\"speaker-summary\">Open research compounds: each reusable capability gives the next project a stronger starting point.</p><p>The close offers three next steps: explore Open-Science, build with the community on GitHub, or speak with AIPOCH about a research collaboration.</p><p>This edition reflects Open-Science v0.26.0 with a September 2026 product snapshot. The QR code points to https://aipoch.com/open-science. Product content is presented for scientific research use; research outputs still require professional review.</p><div class=\"sources\">[Sources]<br><a href=\"https://aipoch.com/open-science\" target=\"_blank\" rel=\"noopener\">Open-Science product page</a><br><a href=\"https://github.com/aipoch/open-science\" target=\"_blank\" rel=\"noopener\">Open-source repository</a><br><a href=\"https://aipoch.com/contact-us\" target=\"_blank\" rel=\"noopener\">AIPOCH contact page</a><br>Architecture artwork: AIPOCH 2026 mid-year review.</div></aside>\n</section>\n</main></div>\n<div class=\"key-hint\">← → SLIDES　O OVERVIEW　N NOTES　F FULLSCREEN</div>\n<nav class=\"controls\" aria-label=\"Presentation controls\"><button id=\"prevBtn\" aria-label=\"Previous slide\" title=\"Previous slide (←)\">←</button><span id=\"slideCounter\" class=\"counter\" aria-live=\"polite\">01 / 17</span><button id=\"nextBtn\" aria-label=\"Next slide\" title=\"Next slide (→)\">→</button><span class=\"sep\"></span><button id=\"overviewBtn\" aria-label=\"Open overview\" title=\"Overview (O)\">Overview</button><button id=\"notesBtn\" aria-label=\"Open speaker notes\" title=\"Speaker notes and sources (N)\">Notes</button><button id=\"fullBtn\" aria-label=\"Present fullscreen\" title=\"Fullscreen (F)\">Full</button><button id=\"helpBtn\" aria-label=\"Open help\" title=\"Shortcuts and print\">?</button></nav>\n<dialog id=\"overviewDialog\" aria-labelledby=\"overviewTitle\"><div class=\"dialog-head\"><h2 id=\"overviewTitle\">Open-Science · 17-slide overview</h2><button data-close=\"overviewDialog\" aria-label=\"Close overview\">Close ×</button></div><div id=\"overviewGrid\" class=\"overview-grid\"></div></dialog>\n<dialog id=\"notesDialog\" aria-labelledby=\"notesTitle\"><div class=\"dialog-head\"><h2 id=\"notesTitle\">Speaker notes and sources</h2><button data-close=\"notesDialog\" aria-label=\"Close speaker notes\">Close ×</button></div><div id=\"notesContent\" class=\"notes-content\"></div></dialog>\n<dialog id=\"imageDialog\" aria-labelledby=\"imageTitle\"><div class=\"dialog-head\"><h2 id=\"imageTitle\">Product screenshot</h2><button data-close=\"imageDialog\" aria-label=\"Close screenshot\">Close ×</button></div><div id=\"imageZoom\"></div></dialog>\n<dialog id=\"helpDialog\" aria-labelledby=\"helpTitle\"><div class=\"dialog-head\"><h2 id=\"helpTitle\">Presentation help</h2><button data-close=\"helpDialog\" aria-label=\"Close help\">Close ×</button></div><div class=\"help-list\"><div><kbd>← / →</kbd>Previous / next slide</div><div><kbd>Space</kbd>Next slide</div><div><kbd>Home / End</kbd>First / last slide</div><div><kbd>O</kbd>Open or close overview</div><div><kbd>N</kbd>Open or close notes</div><div><kbd>F</kbd>Enter or exit fullscreen</div><div><kbd>H</kbd>Hide or show controls</div><div><kbd>Esc</kbd>Close dialog</div></div><p style=\"font-size:16px;color:#777;line-height:1.8;margin-top:25px\">Swipe left or right on touch screens. Slides 06–12 include tabs for product features and real screenshots. Select a screenshot to view the full, uncropped image. Assets and styles are embedded for offline viewing; external links require internet access. Browser print can export all 17 slides—enable background graphics for best results.</p><button id=\"printBtn\" style=\"margin-top:20px;border:1px solid #ccc;background:#f1dd67;padding:11px 19px;color:#111\">Print / Save as PDF</button></dialog>\n<div id=\"toast\" class=\"toast\" role=\"status\"></div>\n<script>\n(()=>{'use strict';\n const slides=[...document.querySelectorAll('.slide')], deck=document.getElementById('deck');\n const total=slides.length, dialogs=[...document.querySelectorAll('dialog')];\n let current=0, touchX=0, touchY=0, touchTarget=null, toastTimer;\n const clamp=n=>Math.max(0,Math.min(total-1,n));\n function fit(){document.documentElement.style.setProperty('--scale',String(Math.min(innerWidth/1600,innerHeight/900)));}\n function syncNotes(){document.getElementById('notesTitle').textContent=`${String(current+1).padStart(2,'0')} / ${slides[current].dataset.title}`;document.getElementById('notesContent').innerHTML=slides[current].querySelector('.notes').innerHTML;}\n function showSlide(n,updateHash=true){current=clamp(n);slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',i===current?'false':'true');s.inert=i!==current;});deck.classList.toggle('chrome-light',!slides[current].classList.contains('slide-dark'));document.getElementById('slideCounter').textContent=`${String(current+1).padStart(2,'0')} / ${total}`;document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===total-1;document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';document.querySelectorAll('.overview-item').forEach((b,i)=>b.setAttribute('aria-current',i===current?'true':'false'));if(updateHash){try{history.replaceState(null,'',`#slide-${String(current+1).padStart(2,'0')}`);}catch{}}syncNotes();}\n function toast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}\n function toggleDialog(id){const d=document.getElementById(id);if(d.open){d.close();return;}dialogs.forEach(x=>x.open&&x.close());if(id==='notesDialog')syncNotes();d.showModal();}\n async function fullscreen(){try{if(document.fullscre ;};shot.addEventListener('click',open);shot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();open();}});});\n dialogs.forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));\n const overview=document.getElementById('overviewGrid');slides.forEach((s,i)=>{const b=document.createElement('button');b.className='overview-item';b.setAttribute('aria-label',`Go to slide ${i+1}: ${s.dataset.title}`);const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const text=document.createElement('span');text.textContent=s.dataset.title;b.append(num,text);b.addEventListener('click',()=>{showSlide(i);document.getElementById('overviewDialog').close();});overview.append(b);});\n const journey=document.querySelector('[data-research-journey]');\n if(journey){\n  const steps=[...journey.querySelectorAll('[data-journey-step]')];\n  const panels=[...journey.querySelectorAll('[data-journey-panel]')];\n  function selectJourney(index,moveFocus=false){\n   steps.forEach((step,i)=>{const active=i===index;step.setAttribute('aria-selected',String(active));step.tabIndex=active?0:-1;});\n   panels.forEach((panel,i)=>{panel.hidden=i!==index;panel.toggleAttribute('inert',i!==index);});\n   journey.dataset.journeyCurrent=String(index);\n   if(moveFocus)steps[index].focus();\n  }\n  steps.forEach((step,i)=>{\n   step.addEventListener('click',()=>selectJourney(i));\n   step.addEventListener('keydown',e=>{\n    if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;\n    e.preventDefault();e.stopPropagation();\n    const index=e.key==='Home'?0:e.key==='End'?steps.length-1:(i+(e.key==='ArrowRight'?1:steps.length-1))%steps.length;\n    selectJourney(index,true);\n   });\n  });\n  journey.querySelectorAll('[data-journey-to]').forEach(button=>button.addEventListener(
